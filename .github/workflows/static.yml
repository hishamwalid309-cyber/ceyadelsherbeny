/* every player gets a complete personal record (personal system) */
function newPlayerFields(){
  return {
    attend:[],          // attendance log — ISO dates
    weightLog:[],       // weight history — [{d,w}]
    coachNotes:[],      // coach notes / messages — [{d,t}]
    wins:0, losses:0, sparring:0, points:0,
    goal:'',            // personal goal
    cat:'',             // boxing weight class
    progId:'',          // program assigned by the coach
    startedAt:today(),  // subscription start
    payments:[]         // payment / renewal history — [{d,plan,amount,method,ref}]
  };
}
function seedPlayers(){
  return SEED_PLAYERS.map(function(p,i){
    const base={id:'pl'+(i+1), nameAr:p[0], nameEn:p[1], username:p[1], password:p[2], phone:p[3],
      age:'', weight:'', height:'', level:i<3?'مبتدئ':'متوسط', plan:'شهري', status:'active',
      joinDate:today(), expiry:'', payMethod:'إنستاباي', payRef:'', notes:'', champ:false};
    const ex = Object.assign(newPlayerFields(), {startedAt:today()});
    /* give seeded players some starter attendance so the system looks alive */
    for(let k=0;k<6;k++){ const d=new Date(); d.setDate(d.getDate()-(k*3+1)); ex.attend.push(iso(d)); }
    ex.points = ex.attend.length*2;
    return Object.assign(base, ex);
  });
}
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(str,n){
  const d = str? new Date(str+'T00:00:00') : new Date();
  if(isNaN(d)) return today();
  d.setDate(d.getDate()+n); return iso(d);
}
