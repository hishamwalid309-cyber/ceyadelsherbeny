    ok('📝', t('ok'), esc(L('تمت إضافة الملاحظة، وتظهر للاعب في صفحة ملفه.','Note added — it appears on the player profile page.')),
      [{l:'💬 '+L('إرسالها واتساب','Send on WhatsApp'), fn:function(){ msgToPlayer(p, L('رسالة من الكابتن إياد:\n\n','Message from Coach Eyad:\n\n')+o.t); }},
       {l:L('تمام','OK'), p:true}]);
  });
}
function toggleChamp(id){
  const p=(DB.players||[]).find(x=>x.id===id); if(!p) return;
  p.champ=!p.champ; saveDB(); renderAll();
  ok('🏆', t('ok'), esc(p.nameAr+' — '+(p.champ? L('تم ترقيته بطل النادي 🏆','Promoted to club champion 🏆') : L('تم إلغاء شارة البطل','Champion badge removed'))));
}
/* ---------- admin: broadcast messages ---------- */
function bcTargets(){
  const mode=($('#bcTo')&&$('#bcTo').value)||'active';
  const pls=DB.players||[];
  if(mode==='active') return pls.filter(function(p){ return p.status==='active'; });
  if(mode==='expiring') return pls.filter(function(p){ const d=daysLeft(p); return p.status!=='active'||(d!==null&&d<=7); });
  return pls.slice();
}
function renderBroadcast(){
  const el=$('#bcTbl'); if(!el) return;
  const pls=bcTargets();
  buildTbl('#bcTbl',[t('th.name'),t('th.phone'),t('th.status'),t('th.act')],
    pls.map(function(p){
      return ['<b>'+esc(p.nameAr)+'</b>', '<span dir="ltr">'+esc(p.phone||'—')+'</span>', subChip(p),
        '<div class="tbl-acts"><button class="btn sm w" data-bcw="'+p.id+'">💬 '+L('إرسال','Send')+'</button></div>'];
    }), t('msg.noplayers'));
}
function broadcastSend(only){
  const txt=($('#bcMsg')&&$('#bcMsg').value)||'';
  if(!txt.trim()){ ok('⚠️','!',esc(L('اكتب نص الرسالة أولًا.','Type the message first.'))); return; }
  const head=L('نادي الكابتن إياد الشربيني 🥊\n\n','Cap Eyad Boxing Club 🥊\n\n');
  if(only){
    const p=(DB.players||[]).find(x=>x.id===only);
    if(p) msgToPlayer(p, head+txt);
    return;
  }
  const pls=bcTargets().filter(function(p){ return intlNum(p.phone); });
  if(!pls.length){ ok('⚠️','!',esc(L('لا يوجد لاعبون لديهم أرقام موبايل في هذه القائمة.','No players with mobile numbers in this list.'))); return; }
  ok('📢', L('رسائل جماعية','Group message'),
    '<p class="sm">'+esc(L('اضغط على كل زر بالترتيب لإرسال الرسالة إلى كل لاعب (واتساب يمنع الإرسال التلقائي المتعدد).','Tap each button in order to send to every player (WhatsApp blocks automatic bulk sending).'))+'</p>'+
    '<div class="flex mt2" style="flex-wrap:wrap">'+pls.map(function(p,i){
      return '<button class="btn sm w" data-bcsend="'+p.id+'">'+(i+1)+'. '+esc(p.nameAr)+'</button>';
    }).join('')+'</div>');
}
function broadcastCopy(){
  const nums=bcTargets().map(function(p){ return (p.nameAr+' — '+intlNum(p.phone)).trim(); }).filter(Boolean).join('\n');
  if(!nums) return;
  const done=function(){ ok('📋', t('ok'), esc(L('تم نسخ قائمة الأرقام.','Phone list copied.'))); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(nums).then(done, done); }
  else{ const ta=document.createElement('textarea'); ta.value=nums; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); done(); }
}
function switchTab(tab){
  S.tab=tab;
  $$('#adTabs button').forEach(b=>b.classList.toggle('act', b.getAttribute('data-tab')===tab));
  ['players','requests','programs','schedule','attendance','billing','ann','broadcast','content','settings','backup'].forEach(function(k){
    const p=$('#ap-'+k); if(p) p.classList.toggle('hide', k!==tab);
  });
  renderAdmin();
}
function gotoAdminTab(tab){
  if(!S.isAdmin){ ok('🔒', L('صلاحية الكابتن فقط','Captain only'), esc(L('هذه الصفحة للكابتن إياد الشربيني فقط.','This page is for Coach Eyad El-Sherbeni only.'))); return; }
  showPage('admin'); switchTab(tab);
}
/* ---------- player admin ---------- */
function savePlayer(o, id){
  const un=String(o.username||'').trim();
  if(!validUserName(un)){ ok('⚠️','!', esc(t('err.userfmt'))); return false; }
  const nu=normUser(un);
  const dup=(DB.players||[]).some(function(p){ return p.id!==id && normUser(p.username)===nu; });
  if(dup){ ok('⚠️','!', esc(t('err.user'))); return false; }
  if(id){
    const p=DB.players.find(x=>x.id===id); if(p) Object.assign(p,o,{username:un});
    if(S.user && !S.isAdmin && S.user.id===id) S.user=p;
  } else {
    DB.players.push(Object.assign({id:uid('pl'), joinDate:today(), status:'active', champ:false, payMethod:'إنستاباي'}, o, {username:un}));
  }
  saveDB(); renderAll(); ok('✅', t('ok'), esc(S.lang==='en'?'Player saved successfully.':'تم حفظ بيانات اللاعب بنجاح.'));
  return true;
}
function waPlayerMsg(p){
  return (S.lang==='en'?'Your boxing club account — Cap Eyad El-Sherbeni\n\n':'بيانات حسابك في نادي الكابتن إياد الشربيني\n\n')+
    (S.lang==='en'?'Name: ':'الاسم: ')+p.nameAr+'\n'+(S.lang==='en'?'Username: ':'اسم المستخدم: ')+p.username+'\n'+
    (S.lang==='en'?'Password: ':'كلمة المرور: ')+p.password+'\n'+(S.lang==='en'?'Package: ':'الباقة: ')+(p.plan||'—')+'\n'+
    (S.lang==='en'?'Status: ':'الحالة: ')+(p.status||'')+'\n'+(S.lang==='en'?'Site: ':'الموقع: ')+location.href.split('#')[0];
}
/* ---------- requests ---------- */
function approveReq(rid){
  const r=(DB.requests||[]).find(x=>x.rid===rid); if(!r) return;
  const p=(DB.players||[]).find(x=>x.id===r.id);
  if(p){ p.status='active'; }
  DB.requests=DB.requests.filter(x=>x.rid!==rid);
  saveDB(); renderAll();
  notifyCaptain((S.lang==='en'?'✅ Your subscription is confirmed. Welcome! \n\n':'✅ تم تأكيد اشتراكك. أهلاً بك! \n\n')+
    (S.lang==='en'?'Name: ':'الاسم: ')+r.nameAr+'\n'+(S.lang==='en'?'Username: ':'اسم المستخدم: ')+r.username+'\n'+
    (S.lang==='en'?'Password: ':'كلمة المرور: ')+r.password);
  ok('✅', t('btn.approve'), esc(S.lang==='en'?'Player approved and marked active.':'تم اعتماد اللاعب وتحويل حالته إلى نشط.'));
}
function rejectReq(rid){
  const r=(DB.requests||[]).find(x=>x.rid===rid); if(!r) return;
  const p=(DB.players||[]).find(x=>x.id===r.id);
  if(p) p.status='stopped';
  DB.requests=DB.requests.filter(x=>x.rid!==rid);
  saveDB(); renderAll(); ok('✖️', t('btn.reject'), esc(S.lang==='en'?'Request rejected.':'تم رفض الطلب.'));
}
/* ---------- admin events ---------- */
function bindAdmin(){
  document.addEventListener('click', function(e){
    const hit=function(attr){ const el=e.target.closest('['+attr+']'); return el? el.getAttribute(attr):null; };
    let id;
    if(hit('data-tab')){ switchTab(hit('data-tab')); return; }
    if((id=hit('data-gotab'))){ gotoAdminTab(id); return; }
    if((id=hit('data-att'))){ tickAtt(id, today()); return; }
    if((id=hit('data-attd'))){ tickAtt(id, attDay()); return; }
    if((id=hit('data-renew'))){ renewPlayer(id); return; }
    if((id=hit('data-paid'))){ logPayment(id); return; }
    if((id=hit('data-hist'))){ paymentHistory(id); return; }
    if((id=hit('data-note'))){ addCoachNote(id); return; }
    if((id=hit('data-champ'))){ toggleChamp(id); return; }
    if((id=hit('data-bcsend'))){ broadcastSend(id); return; }
    if((id=hit('data-edp'))){
      const p=DB.players.find(x=>x.id===id);
      openEdit((S.lang==='en'?'Edit player: ':'تعديل اللاعب: ')+p.nameAr, playerFields(), p, function(o){ savePlayer(o,id); });
      return;
    }
    if((id=hit('data-delp'))){
      const p=DB.players.find(x=>x.id===id);
      ok('🗑️', t('confirm.del'), '<b>'+esc(p.nameAr)+'</b>', [
        {l:S.lang==='en'?'Yes, delete':'نعم احذف',p:true,fn:function(){ DB.players=DB.players.filter(x=>x.id!==id); saveDB(); renderAll(); }},
        {l:t('btn.cancel')}]);
      return;
    }
    if((id=hit('data-wap'))){ const p=DB.players.find(x=>x.id===id); notifyCaptain(waPlayerMsg(p)); return; }
    if((id=hit('data-appr'))){ approveReq(id); return; }
    if((id=hit('data-rejr'))){ rejectReq(id); return; }
    if((id=hit('data-wa2'))){ const r=(DB.requests||[]).find(x=>x.rid===id); if(r) notifyCaptain(waRegMessage(r)); return; }
    if((id=hit('data-edpg'))){
      const p=DB.programs.find(x=>x.id===id);
      openEdit('تعديل البرنامج — '+p.title, progFields(), Object.assign({},p,{items:parseItems(p.items).map(it=>[it.ex,it.sets,it.reps,it.rest].join(' | ')).join('\n')}), function(o){ Object.assign(p,o,{items:String(o.items).split('\n').filter(Boolean)}); saveDB(); renderAll(); });
      return;
    }
    if((id=hit('data-delpg'))){ ok('🗑️',t('confirm.del'),'',[{l:'نعم احذف',p:true,fn:function(){ DB.programs=DB.programs.filter(x=>x.id!==id); saveDB(); renderAll(); }},{l:t('btn.cancel')}]); return; }
    if((id=hit('data-edwk'))){ const w=DB.week.find(x=>x.id===id);
      openEdit('تعديل يوم — '+w.day, [{k:'day',l:t('th.day')},{k:'focus',l:t('th.focus')},{k:'work',l:t('th.work'),t:'textarea'}], w, function(o){ Object.assign(w,o); saveDB(); renderAll(); }); return; }
    if((id=hit('data-delwk'))){ DB.week=DB.week.filter(x=>x.id!==id); saveDB(); renderAll(); return; }
    if((id=hit('data-edsch'))){ const s=DB.schedule.find(x=>x.id===id);
      openEdit('تعديل موعد — '+s.day, schFields(), s, function(o){ Object.assign(s,o); saveDB(); renderAll(); }); return; }
    if((id=hit('data-delsch'))){ DB.schedule=DB.schedule.filter(x=>x.id!==id); saveDB(); renderAll(); return; }
    if((id=hit('data-edan'))){ const a=DB.announcements.find(x=>x.id===id);
      openEdit('تعديل إعلان', [{k:'date',l:t('th.date'),t:'date'},{k:'title',l:t('th.title')},{k:'text',l:t('th.text'),t:'textarea'}], a, function(o){ Object.assign(a,o); saveDB(); renderAll(); }); return; }
    if((id=hit('data-delan'))){ DB.announcements=DB.announcements.filter(x=>x.id!==id); saveDB(); renderAll(); return; }
  });
  const on=function(sel,ev,fn){ const el=$(sel); if(el) el.addEventListener(ev,fn); };
  on('#adSearch','input',renderAdmin);
  on('#attDate','change',renderAttendance);
  on('#attAll','click',function(){
    const day=attDay(); let n=0;
    (DB.players||[]).forEach(function(p){ p.attend=p.attend||[]; if(p.attend.indexOf(day)<0){ p.attend.push(day); p.points=(p.points||0)+2; n++; } });
    saveDB(); renderAll(); ok('✅', L('تم التحضير','Marked'), esc(n+' '+L('لاعب تم تسجيل حضورهم.','players marked present.')));
  });
  on('#billSearch','input',renderBilling);
  on('#bcTo','change',renderBroadcast);
  on('#bcOpen','click',function(){ broadcastSend(null); });
  on('#bcCopy','click',broadcastCopy);
  on('#setRegOnce','change',function(e){
    DB.reg=Object.assign({enabled:true,done:false,used:0,username:'',name:'',date:''}, DB.reg||{});
    DB.reg.enabled=e.target.checked; saveDB(); renderAll(); renderAdmin();
    ok('🔐', t('ok'), esc(e.target.checked? L('التسجيل مرة واحدة فقط مُفعَّل.','“Register once only” is ON.') : L('التسجيل مفتوح دائمًا.','Registration is always open.')));
  });
  on('#regUnlock','click',function(){
    DB.reg=Object.assign({enabled:true,done:false,used:0,username:'',name:'',date:''}, DB.reg||{});
    DB.reg.done=false; DB.reg.enabled=true; saveDB(); renderAll(); renderAdmin();
    ok('🔓', t('ok'), esc(L('تم فتح التسجيل مرة أخرى لمرة واحدة فقط من هذا الجهاز.','Registration re-opened for one more sign-up from this device.')));
  });
  on('#regClear','click',function(){
    DB.reg={enabled:true,done:false,used:0,username:'',name:'',date:''}; saveDB(); renderAll(); renderAdmin();
    ok('♻️', t('ok'), esc(L('تم تصفير عدّاد التسجيل.','Registration counter cleared.')));
  });
  on('#addPlayer','click',function(){
    openEdit('إضافة لاعب جديد', playerFields(), {status:'active',level:'مبتدئ',plan:'شهري',payMethod:'إنستاباي'}, function(o){ savePlayer(o,null); });
  });
  on('#addProg','click',function(){ openEdit('إضافة برنامج تدريبي', progFields(), {}, function(o){
      if(!o.title) return false;
      DB.programs.push({id:uid('pg'), title:o.title, level:o.level, duration:o.duration, goal:o.goal, items:String(o.items).split('\n').filter(Boolean), notes:o.notes});
      saveDB(); renderAll(); ok('✅',t('ok'),'');
    }); });
  on('#addWeek','click',function(){ openEdit('إضافة يوم تدريبي', [{k:'day',l:t('th.day')},{k:'focus',l:t('th.focus')},{k:'work',l:t('th.work'),t:'textarea'}], {}, function(o){ DB.week.push(Object.assign({id:uid('w')},o)); saveDB(); renderAll(); }); });
  on('#addSch','click',function(){ openEdit('إضافة موعد تدريبي', schFields(), {}, function(o){ DB.schedule.push(Object.assign({id:uid('s')},o)); saveDB(); renderAll(); }); });
  on('#addAnn','click',function(){ openEdit('إضافة إعلان', [{k:'date',l:t('th.date'),t:'date',def:today()},{k:'title',l:t('th.title')},{k:'text',l:t('th.text'),t:'textarea'}], {}, function(o){ DB.announcements.push(Object.assign({id:uid('a')},o)); saveDB(); renderAll(); }); });
  on('#saveContent','click',function(){
    DB.settings.photo=$('#setPhoto').value; DB.settings.gallery=$('#setGallery').value;
    DB.settings.hero=$('#setHero').value; DB.settings.typed=$('#setTyped').value; DB.settings.address=$('#setAddress').value;
    saveDB(); applySettings(); renderAll(); ok('✅',t('ok'),esc(S.lang==='en'?'Content updated.':'تم تحديث المحتوى.'));
  });
  on('#setPhotoFile','change',function(e){
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=function(){ DB.settings.photo=r.result; $('#setPhoto').value=''; saveDB(); applySettings(); renderAdmin(); ok('🖼️',t('ok'),esc(S.lang==='en'?'Photo updated.':'تم تحديث الصورة.')); };
    r.readAsDataURL(f);
  });
  on('#saveSettings','click',function(){
    const s=DB.settings;
    s.wa=String($('#setWa').value).replace(/[^0-9]/g,'')||WA_DEF;
    s.insta=$('#setInsta').value; s.voda=$('#setVoda').value; s.phone=s.insta;
    s.price1=$('#setP1').value; s.price2=$('#setP2').value; s.price3=$('#setP3').value; s.price4=$('#setP4').value;
    saveDB(); applySettings(); renderAll(); ok('💾',t('ok'),esc(S.lang==='en'?'Settings saved.':'تم حفظ الإعدادات.'));
  });
  on('#saveAdmin','click',function(){
    const u=$('#setAdmU').value.trim(), p=$('#setAdmP').value;
    if(u.length<3||p.length<4){ ok('⚠️','!',esc(t('err.required'))); return; }
    DB.admins[0].username=u; DB.admins[0].password=p;
    if(S.isAdmin) S.user=Object.assign({},S.user,{username:u});
    saveDB(); renderAll(); ok('👑',t('ok'),esc(S.lang==='en'?'Admin credentials updated.':'تم تحديث بيانات حساب الكابتن.'));
  });
  on('#setSound','change',function(e){ setSound(e.target.checked); });
  on('#expBtn','click',function(){
    const data=JSON.stringify(DB,null,2);
    const b=new Blob([data],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='eyad-club-backup-'+today()+'.json'; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },900);
    ok('💾',t('ok'),esc(S.lang==='en'?'Backup file downloaded.':'تم تنزيل ملف النسخة الاحتياطية.'));
  });
  on('#impFile','change',function(e){
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=function(){
      try{ const d=JSON.parse(r.result); DB=Object.assign(defaultDB(),d);
        if(!DB.settings) DB.settings=defaultDB().settings;
        saveDB(); applySettings(); renderAll(); switchTab('players');
        ok('📥',t('ok'),esc(S.lang==='en'?'Backup restored.':'تم استيراد النسخة الاحتياطية.'));
      }catch(err){ ok('⚠️','!',esc(S.lang==='en'?'Invalid file.':'الملف غير صالح.')); }
    };
    r.readAsText(f);
  });
  on('#resetBtn','click',function(){
    ok('♻️',t('ad.reset'),esc(t('ad.resetD')),[
      {l:S.lang==='en'?'Yes, reset everything':'نعم أعد التعيين',p:true,fn:function(){ localStorage.removeItem(LS_KEY); DB=defaultDB(); saveDB(); location.reload(); }},
      {l:t('btn.cancel')}]);
  });
}
function progFields(){
  return [{k:'title',l:'عنوان البرنامج'},{k:'level',l:t('th.level'),t:'select',o:['كل المستويات'].concat(LEVELS)},
    {k:'duration',l:'المدة'},{k:'goal',l:'هدف البرنامج',t:'textarea'},
    {k:'items',l:'التمارين — سطر لكل تمرين بهذا الشكل: التمرين | مجموعات | تكرار | راحة',t:'lines',h:'مثال: جاب على الشنطة | 4 | 20 عدة | 30 ث'},
    {k:'notes',l:'ملاحظات',t:'textarea'}];
}
function schFields(){
  return [{k:'day',l:t('th.day')},{k:'time',l:t('th.time')},{k:'group',l:t('th.group')},
    {k:'coach',l:t('th.coach')},{k:'place',l:t('th.place')},{k:'notes',l:t('th.notes')}];
}
/* ---------- global events ---------- */
function bindGlobal(){
  document.addEventListener('click', function(e){
    const el=e.target.closest('button,a,.mini,.ubox,.card,.plan,.tabs button,nav a,.mq');
    if(el && !e.target.closest('.no-sound')) punch(0.035);
    if(el){
      const r=document.createElement('div'); r.className='punch';
      r.style.left=e.clientX+'px'; r.style.top=e.clientY+'px';
      document.body.appendChild(r); setTimeout(function(){ r.remove(); },560);
    }
    const c=e.target.closest('[data-close]');
    if(c){ closeModal(c.getAttribute('data-close')); }
    const m=e.target.closest('.modal');
    if(m && e.target===m) m.classList.remove('on');
    const cp=e.target.closest('[data-copy]');
    if(cp){ copyText(cp.getAttribute('data-copy')); }
    const pg=e.target.closest('[data-prog]');
    if(pg){ showProgram(pg.getAttribute('data-prog')); }
    const pfa=e.target.closest('[data-pf]');
    if(pfa){ pfAction(pfa.getAttribute('data-pf')); }
    if(e.target.closest('#pfWBtn')){ saveWeight(); }
    if(e.target.closest('#pfGoalBtn')){ saveGoal(); }
    if(e.target.closest('#regGoLogin')){ gateHome(); }
    const go=e.target.closest('[data-go]');
    if(go){
      const dest=go.getAttribute('data-go');
      if(!S.user){
        if(dest==='store'){ window.open(STORE_URL,'_blank','noopener'); return; }
        if(dest==='register'){ guestRegister(); return; }
        ok('🔒', S.lang==='en'?'Please sign in':'سجّل الدخول أولًا', esc(S.lang==='en'?'This section is available after login.':'هذا القسم متاح بعد تسجيل الدخول.'));
        return;
      }
      showPage(dest);
      return;
    }
    const na=e.target.closest('#nav a[data-page]');
    if(na){ showPage(na.getAttribute('data-page')); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ $$('.modal.on').forEach(m=>m.classList.remove('on')); }
    if(e.key==='Enter' && $('#gate').style.display!=='none'){
      const a=document.activeElement;
      if(a && (a.id==='lu'||a.id==='lp')){ e.preventDefault(); $('#loginForm').dispatchEvent(new Event('submit',{cancelable:true})); }
    }
  });
  const eye=function(btn){ const el=$('#'+btn.getAttribute('data-eye')); if(!el) return; el.type = el.type==='password'?'text':'password'; };
  document.addEventListener('click', function(e){ const b=e.target.closest('[data-eye]'); if(b){ eye(b); } });
  $('#loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const err=$('#loginErr'); err.textContent='';
    if($('#lgree') && !$('#lgree').checked){ err.textContent=S.lang==='en'?'Please accept the club rules.':'من فضلك وافق على قواعد النادي.'; return; }
    const res=loginResult($('#lu').value.trim(), $('#lp').value);
    if(res.err){ err.textContent=res.err; $('#loginBtn').classList.add('shake'); setTimeout(function(){ $('#loginBtn').classList.remove('shake'); },450); return; }
    if(res.admin){ S.isAdmin=true; S.user={id:'admin', username:DB.admins[0].username, nameAr:'الكابتن إياد الشربيني', status:'active'}; }
    else { S.isAdmin=false; S.user=res.player; }
    punch(0.06);
    afterLogin();
  });
  $('#logoutBtn').addEventListener('click', function(){
    ok('🚪', S.lang==='en'?'Log out':'تسجيل الخروج', esc(S.lang==='en'?'Do you want to log out? The login screen will appear again.':'هل تريد الخروج؟ ستظهر شاشة تسجيل الدخول مرة أخرى.'),[
      {l:S.lang==='en'?'Yes, log out':'نعم اخرج',p:true,fn:logout},{l:t('btn.cancel')}]);
  });
  $('#burger').addEventListener('click', function(){ $('#nav').classList.toggle('open'); });
  $('#langBtn').addEventListener('click', function(){ applyLang(S.lang==='en'?'ar':'en'); });
  $('#gateLang').addEventListener('click', function(){ applyLang(S.lang==='en'?'ar':'en'); });
  $('#soundBtn').addEventListener('click', function(){ setSound(!S.sound); });
  $('#fabSound').addEventListener('click', function(){ setSound(!S.sound); });
  $('#gateSound').addEventListener('click', function(){ setSound(!S.sound); });
  $('#gateBack').addEventListener('click', gateHome);
  $('#gateWa').addEventListener('click', function(){
    openWA(S.lang==='en'?'Hello Coach Eyad, I would like to ask about boxing training.':'السلام عليكم كابتن إياد، أريد الاستفسار عن التدريب في النادي.');
  });
  $('#homeWa').addEventListener('click', function(){ openWA('السلام عليكم كابتن إياد، أريد الاستفسار عن الاشتراك والتدريب.'); });
  $('#ctWaBtn').addEventListener('click', function(){ openWA('السلام عليكم كابتن إياد، أريد الاستفسار عن التدريب.'); });
  $('#storeWa').addEventListener('click', function(){ openWA('السلام عليكم، أريد الاستفسار عن منتج من متجر الكابتن إياد.'); });
  const ftw=$('#ftWa'); if(ftw) ftw.addEventListener('click', function(e){ e.preventDefault(); openWA('السلام عليكم كابتن إياد.'); });
  $('#regForm').addEventListener('submit', submitRegister);
  $('#meSave').addEventListener('click', saveMe);
  $('#cpBtn').addEventListener('click', changePass);
  $('#dataSearch').addEventListener('input', renderData);
  $('#dataFilter').addEventListener('change', renderData);
  $('#chSearch').addEventListener('input', renderChamps);
  $('#dataPrint').addEventListener('click', function(){ window.print(); });
  $('#dataExport').addEventListener('click', function(){ $('#expBtn') && $('#expBtn').click(); });
  $('#fabTop').addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); });
  window.addEventListener('scroll', function(){
    const h=document.documentElement;
    const pc=(h.scrollTop||document.body.scrollTop)/((h.scrollHeight-h.clientHeight)||1)*100;
    const sp=$('#sprog'); if(sp) sp.style.width=pc+'%';
    const ft=$('#fabTop'); if(ft) ft.style.opacity = pc>6?'1':'0.45';
  }, {passive:true});
}

/* ---------- init ---------- */
function init(){
  DB=loadDB();
  buildMarquee(); fillRegSelects();
  applySettings(); renderAll();
  applyLang(DB.settings.lang||'ar');
  setSound(DB.settings.sound!==false, true);
  bindGlobal(); bindAdmin();
  reveal(); typeLoop();
  setTimeout(counters,600);
  $$('.yr').forEach(e=>e.textContent=new Date().getFullYear());
  const ph=DB.settings.phone||PHONE_DEF;
  ['#ctPhone','#ctPhone2','#aboutPhone'].forEach(function(s){ const el=$(s); if(el) el.textContent=ph; });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
</body>
</html>
