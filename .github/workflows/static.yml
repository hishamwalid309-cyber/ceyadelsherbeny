/* ---------- storage ---------- */
let DB;
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      const base = defaultDB();
      d.settings = Object.assign({}, base.settings, d.settings||{});
      d.players = d.players||base.players; d.programs=d.programs||base.programs;
      d.week=d.week||base.week; d.schedule=d.schedule||base.schedule;
      d.announcements=d.announcements||base.announcements; d.requests=d.requests||[];
      d.admins = (d.admins&&d.admins.length)?d.admins:base.admins;
      /* keep all captain aliases working even for data saved before the update */
      d.admins[0].aliases = (base.admins[0].aliases||[]).concat(d.admins[0].aliases||[]).filter(function(v,i,a){ return a.indexOf(v)===i; });
      d.reg = Object.assign({enabled:true,done:false,used:0,username:'',name:'',date:''}, d.reg||{});
      d.players = (d.players||[]).map(function(p){
        const ex=newPlayerFields();
        Object.keys(ex).forEach(function(k){ if(p[k]===undefined) p[k]=ex[k]; });
        if(!Array.isArray(p.attend)) p.attend=[];
        if(!Array.isArray(p.weightLog)) p.weightLog=[];
        if(!Array.isArray(p.coachNotes)) p.coachNotes=[];
        if(!Array.isArray(p.payments)) p.payments=[];
        if(!p.startedAt) p.startedAt=p.joinDate||today();
        return p;
      });
      return d;
    }
  }catch(e){ console.warn('load error',e); }
  return defaultDB();
}
function saveDB(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ console.warn(e); } }

/* ---------- state / utils ---------- */
const S = { user:null, isAdmin:false, page:'home', lang:'ar', sound:true, tab:'players' };
const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
function uid(p){ return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toInt(v){ const n=parseInt(v,10); return isNaN(n)?0:n; }
/* usernames are the players'/captain's own names — compare them space/dash/case-insensitively */
function normUser(s){ return String(s==null?'':s).toLowerCase().replace(/[\s_\-\.\u0640]/g,'').trim(); }
function validUserName(s){
  const v=String(s||'').trim();
  if(v.length<2 || v.length>40) return false;
  return /^[A-Za-z0-9\u0600-\u06FF\s_.\-]+$/.test(v);
}

