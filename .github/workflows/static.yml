/* ---------- personal system helpers ---------- */
const L = function(ar,en){ return S.lang==='en'? en : ar; };
function daysLeft(p){
  if(!p || !p.expiry) return null;
  const e=new Date(p.expiry+'T00:00:00'); if(isNaN(e)) return null;
  const n=new Date(today()+'T00:00:00');
  return Math.round((e-n)/86400000);
}
function subChip(p){
  const d=daysLeft(p);
  if(p.status==='pending') return '<span class="chip bl">⏳ '+esc(t('st.pending'))+'</span>';
  if(p.status==='stopped') return '<span class="chip rd">⛔ '+esc(t('st.stopped'))+'</span>';
  if(d===null) return stChip(p.status);
  if(d<0)  return '<span class="chip rd">⌛ '+L('انتهى الاشتراك','Expired')+'</span>';
  if(d<=7) return '<span class="chip rd">⚠️ '+d+' '+L('يوم متبقي','days left')+'</span>';
  if(d<=20)return '<span class="chip bl">🕔 '+d+' '+L('يوم متبقي','days left')+'</span>';
  return '<span class="chip gr">✅ '+d+' '+L('يوم متبقي','days left')+'</span>';
}
function myPlayer(){
  if(!S.user || S.isAdmin) return null;
  return (DB.players||[]).find(function(x){ return x.id===S.user.id; }) || null;
}
function monthDays(){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const arr=[];
  for(let d=1; d<=last.getDate(); d++){
    const dt=new Date(y,m,d);
    arr.push({d:d, iso:iso(dt), dow:dt.getDay()});
  }
  return {list:arr, firstDow:first.getDay(), label:n.toLocaleDateString(S.lang==='en'?'en-GB':'ar-EG',{month:'long',year:'numeric'})};
}
function streakOf(p){
  const set={}; (p.attend||[]).forEach(function(d){ set[d]=1; });
  let s=0, cur=new Date();
  for(let i=0;i<400;i++){
    const k=iso(cur);
    if(set[k]){ s++; } else if(i>0){ break; }
    cur.setDate(cur.getDate()-1);
  }
  return s;
}
function levelPct(p){
  const need={'مبتدئ':20,'متوسط':45,'متقدم':80,'محترف':130,'أطفال':15}[p.level]||20;
  const a=(p.attend||[]).length;
  return Math.max(4, Math.min(100, Math.round(a/need*100)));
}
function weightChart(p){
  const log=(p.weightLog||[]).slice(-10);
  if(log.length<2) return '<p class="sm mut mb0">'+esc(L('سجّل وزنك مرتين على الأقل ليظهر مخطط التطور.','Log your weight at least twice to see the progress chart.'))+'</p>';
  const ws=log.map(function(x){ return Number(x.w)||0; });
  const mn=Math.min.apply(null,ws), mx=Math.max.apply(null,ws), span=(mx-mn)||1;
  const W=320,H=110,pad=10;
  const pts=ws.map(function(w,i){
    const x=pad+(W-pad*2)*(i/(ws.length-1));
    const y=H-pad-((w-mn)/span)*(H-pad*2);
    return {x:x,y:y,w:w};
  });
  const line=pts.map(function(p,i){ return (i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1); }).join(' ');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" dir="ltr">'+
    '<defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e01b2b"/><stop offset="1" stop-color="#efc463"/></linearGradient></defs>'+
    '<line class="gl" x1="0" y1="'+(H-pad)+'" x2="'+W+'" y2="'+(H-pad)+'"/><line class="gl" x1="0" y1="'+pad+'" x2="'+W+'" y2="'+pad+'"/>'+
    '<path class="ln" d="'+line+'"/>'+pts.map(function(p){ return '<circle class="pt" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.4"/>'; }).join('')+
    '</svg><div class="flex between xs mut mt1"><span>'+esc(log[0].w)+' kg · '+esc(log[0].d)+'</span><span>'+esc(log[log.length-1].w)+' kg · '+esc(log[log.length-1].d)+'</span></div>';
}
function suggestProgram(level){
  const map={'مبتدئ':'البرنامج التجريبي الكامل — 7 أيام','متوسط':'اللياقة والتحمل الملاكمي','متقدم':'القوة والانفجار العضلي','محترف':'إعداد البطولات (احترافي)','أطفال':'برنامج المبتدئين — الأساسيات'};
  return (S.lang==='en'?'Suggested for your level: ':'المقترح لمستواك: ')+(map[level]||'برنامج المبتدئين — الأساسيات');
}
function myProgram(p){
  if(p.progId){ const g=(DB.programs||[]).find(function(x){ return x.id===p.progId; }); if(g) return g; }
  const map={'مبتدئ':'البرنامج التجريبي الكامل — 7 أيام','متوسط':'اللياقة والتحمل الملاكمي','متقدم':'القوة والانفجار العضلي','محترف':'إعداد البطولات (احترافي)','أطفال':'برنامج المبتدئين — الأساسيات'};
  const want=map[p.level];
  return (DB.programs||[]).find(function(x){ return x.title===want; }) || (DB.programs||[])[0] || null;
}
function personalReport(p){
  const d=daysLeft(p);
  return L('تقرير اللاعب — ','PLAYER REPORT — ')+p.nameAr+'\n'+
    L('اسم المستخدم: ','Username: ')+p.username+'\n'+
    L('المستوى: ','Level: ')+p.level+' · '+L('الباقة: ','Package: ')+(p.plan||'—')+'\n'+
    L('حالة الاشتراك: ','Subscription: ')+(p.status||'')+(d!==null?' ('+d+' '+L('يوم متبقي','days left')+')':'')+'\n'+
    L('الوزن: ','Weight: ')+(p.weight||'—')+' kg · '+L('الطول: ','Height: ')+(p.height||'—')+' cm\n'+
    L('عدد مرات الحضور: ','Sessions attended: ')+(p.attend||[]).length+'\n'+
    L('الحضور المتتالي: ','Current streak: ')+streakOf(p)+'\n'+
    L('التمارين مع الكابتن: ','Sparring: ')+(p.sparring||0)+' · '+L('فوز: ','Wins: ')+(p.wins||0)+'\n'+
    L('هدفي: ','My goal: ')+(p.goal||'—')+'\n'+
    L('التاريخ: ','Date: ')+today();
}

