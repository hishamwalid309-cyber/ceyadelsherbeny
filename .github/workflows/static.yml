    [{l:L('إغلاق','Close'),p:true}]);
}
function addCoachNote(id){
  const p=(DB.players||[]).find(x=>x.id===id); if(!p) return;
  openEdit(L('ملاحظة / رسالة للاعب — ','Note / message — ')+p.nameAr, [
