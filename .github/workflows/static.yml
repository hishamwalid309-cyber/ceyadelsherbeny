        '<td><div class="tbl-acts"><button class="btn sm" data-edp="'+esc(p.id)+'">✏️</button><button class="btn sm w" data-wap="'+esc(p.id)+'">💬</button><button class="btn sm d" data-delp="'+esc(p.id)+'">🗑️</button></div></td></tr>';
