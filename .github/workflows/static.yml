    <div class="grid g2">
      <div class="reveal">
        <p class="lead" data-i18n="about.p1">الكابتن إياد الشربيني مدرب ملاكمه مصري، صاحب مدرسة تدريبية واضحة في فنون الملاكمة: يبدأ من الأساسيات الصحيحة، ثم يبني المهارة واللياقة والانضباط، حتى يصل اللاعب إلى حلبة البطولات بثقة وقدرة حقيقية.</p>
        <p data-i18n="about.p2">خلال سنوات طويلة من العمل داخل الصالات والجيمات، درّب الكابتن إياد في أماكن ومنشآت رياضية كثيرة، وتنقّل بين مدارس تدريب مختلفة التخصصات حتى صقل خبرته، وتعامل مع لاعبين من كل الأعمار والمستويات: من الطفل الذي يقف على الحلبة لأول مرة، إلى الملاكم الذي يستعد لمباراة رسمية.</p>
        <p data-i18n="about.p3">شارك الكابتن إياد في بطولات محلية ودولية كثيرة، وحقق مع لاعبيه نتائج مشرفة ومراكز متقدمة، كما درّب أجيالًا من الأبطال الذين واصلوا الطريق في البطولات والمنافسات. خبرته العملية في الحلبة هي الأساس الذي بُني عليه منهجه التدريبي: لا نظريات فقط، بل تدريب حقيقي ينتهي بمهارة تُستخدم في المباراة.</p>
        <p data-i18n="about.p4">فلسفة الكابتن إياد تقوم على ثلاث كلمات: الانضباط، الاحترام، والاستمرار. الانضباط في الحضور والالتزام بالبرنامج، الاحترام بين اللاعبين وداخل النادي، والاستمرار لأن البطل لا يُصنع في يوم.</p>
