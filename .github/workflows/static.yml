<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06060a">
<meta name="description" content="نادي الكابتن إياد الشربيني للملاكمة - Cap Eyad El-Sherbeni Boxing Club. برامج تدريبية، أبطال، اشتراكات، ولوحة تحكم كاملة.">
<title>الكابتن إياد الشربيني | CAP EYAD EL-SHERBENI — Boxing Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%8A%3C/text%3E%3C/svg%3E">
<style>
/* ============ 1. ROOT / RESET ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#06060a; --bg2:#0b0b12; --pnl:rgba(19,19,28,.86); --pnl2:#14141d; --pnl3:#1b1b26;
  --cr:#e01b2b; --cr2:#8b0d18; --gl:#efc463; --gl2:#a8802a;
  --ink:#f6f2ea; --mut:#9c968a; --line:rgba(239,196,99,.16); --line2:rgba(255,255,255,.07);
  --rad:18px; --rad2:12px; --sh:0 18px 45px rgba(0,0,0,.55); --sh2:0 8px 24px rgba(0,0,0,.4);
  --grad:linear-gradient(135deg,#e01b2b,#efc463);
  --ff:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --hh:66px;
}
html{scroll-behavior:smooth}
html[dir=ltr] body{font-family:'Tajawal','Cairo',system-ui,sans-serif}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--ff);
  font-size:16px; line-height:1.85; overflow-x:hidden; -webkit-tap-highlight-color:transparent;
}
img{max-width:100%; display:block}
a{color:var(--gl); text-decoration:none}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
h1,h2,h3,h4{margin:0 0 .5rem; line-height:1.3; font-weight:900; letter-spacing:.2px}
h1{font-size:clamp(1.8rem,4.4vw,3.1rem)}
h2{font-size:clamp(1.4rem,3vw,2.15rem)}
h3{font-size:clamp(1.1rem,2vw,1.4rem)}
p{margin:0 0 .8rem}
ul{margin:0 0 .8rem; padding-inline-start:1.2rem}
::selection{background:var(--cr); color:#fff}
/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0a0a11}
::-webkit-scrollbar-thumb{background:linear-gradient(#8b0d18,#a8802a); border-radius:20px}
/* ============ 2. BACKGROUND FX ============ */
.bgfx{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.bgfx i{position:absolute; display:block}
.fx-grid{inset:0; background-image:linear-gradient(rgba(239,196,99,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(239,196,99,.05) 1px,transparent 1px); background-size:56px 56px; mask-image:radial-gradient(circle at 50% 20%,#000 0%,transparent 78%)}
.fx-glow{width:60vw; height:60vw; border-radius:50%; filter:blur(90px); opacity:.32}
.fx-glow.a{background:radial-gradient(circle,#e01b2b,transparent 65%); top:-18vw; inset-inline-start:-12vw; animation:drift 22s ease-in-out infinite}
.fx-glow.b{background:radial-gradient(circle,#efc463,transparent 65%); bottom:-22vw; inset-inline-end:-14vw; animation:drift 28s ease-in-out infinite reverse}
.fx-glow.c{background:radial-gradient(circle,#2b3a7a,transparent 65%); top:35%; inset-inline-start:35%; opacity:.18; animation:drift 34s ease-in-out infinite}
.fx-mist{inset:0; background:radial-gradient(ellipse at 50% 120%,rgba(224,27,43,.13),transparent 60%),radial-gradient(ellipse at 50% -20%,rgba(239,196,99,.1),transparent 60%)}
.fx-rings{inset:0; opacity:.5}
.fx-rings i{position:absolute; inset-inline-start:50%; top:50%; border:1px solid rgba(239,196,99,.10); border-radius:50%; transform:translate(-50%,-50%)}
.rope{position:absolute; inset-inline:0; height:3px; background:linear-gradient(90deg,transparent,rgba(224,27,43,.5),rgba(239,196,99,.5),transparent); animation:rope 7s ease-in-out infinite}
.rope.r1{top:16%}.rope.r2{top:48%;animation-delay:1.5s}.rope.r3{top:78%;animation-delay:3s}
.glove-float{position:absolute; font-size:34px; opacity:.13; filter:grayscale(.3); animation:float 15s linear infinite}
/* ============ 3. LAYOUT HELPERS ============ */
.wrap{width:100%; max-width:1240px; margin:0 auto; padding:0 18px; position:relative; z-index:2}
.grid{display:grid; gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.flex{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.between{justify-content:space-between}
.center{justify-content:center}
.tc{text-align:center}
.mt0{margin-top:0}.mb0{margin-bottom:0}
.mt1{margin-top:10px}.mt2{margin-top:20px}.mt3{margin-top:34px}.mb2{margin-bottom:20px}
.mut{color:var(--mut)}
.sm{font-size:.86rem}
.xs{font-size:.76rem}
.b{font-weight:800}
.lead{font-size:1.05rem; color:#d9d3c6}
.hide{display:none !important}
.kbd{background:var(--pnl3); border:1px solid var(--line); border-radius:8px; padding:2px 8px; font-size:.8rem}
/* ============ 4. CARDS / BUTTONS ============ */
.card{background:var(--pnl); border:1px solid var(--line); border-radius:var(--rad); padding:20px; box-shadow:var(--sh2); backdrop-filter:blur(10px); position:relative; overflow:hidden; transition:.35s}
.card::before{content:""; position:absolute; inset-inline-start:0; top:0; height:3px; width:100%; background:var(--grad); opacity:.55; transform:scaleX(0); transform-origin:inline-start; transition:.5s}
.card:hover{transform:translateY(-6px); border-color:rgba(239,196,99,.38); box-shadow:var(--sh)}
.card:hover::before{transform:scaleX(1)}
.card h3{display:flex; align-items:center; gap:9px}
.ico{width:44px; height:44px; border-radius:13px; display:grid; place-items:center; background:linear-gradient(145deg,rgba(224,27,43,.22),rgba(239,196,99,.14)); border:1px solid var(--line); font-size:22px; flex:0 0 auto}
.ico.lg{width:60px;height:60px;font-size:30px;border-radius:16px}
.btn{display:inline-flex; align-items:center; gap:9px; justify-content:center; padding:12px 22px; border-radius:999px; border:1px solid var(--line); background:var(--pnl3); color:var(--ink); font-weight:800; cursor:pointer; transition:.28s; position:relative; overflow:hidden; white-space:nowrap}
.btn:hover{transform:translateY(-2px); border-color:var(--gl); background:#232332}
.btn.p{background:var(--grad); color:#1a0507; border-color:transparent; box-shadow:0 10px 26px rgba(224,27,43,.30)}
.btn.p:hover{filter:brightness(1.08)}
.btn.g{background:#1d2a1d; border-color:rgba(80,200,120,.4); color:#c9f5d5}
.btn.w{background:#0f2a1b; border-color:rgba(37,211,102,.45); color:#b8f5cf}
.btn.d{background:#2a1013; border-color:rgba(224,27,43,.45); color:#ffc9cf}
.btn.sm{padding:8px 15px; font-size:.85rem}
.btn.lg{padding:15px 30px; font-size:1.05rem}
.btn.blk{width:100%}
.btn.gh{background:transparent}
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; background:rgba(239,196,99,.1); border:1px solid var(--line); font-size:.78rem; font-weight:700; color:var(--gl)}
.chip.rd{background:rgba(224,27,43,.14); border-color:rgba(224,27,43,.4); color:#ffb4bb}
.chip.gr{background:rgba(40,200,120,.12); border-color:rgba(40,200,120,.35); color:#a9f0c6}
.chip.bl{background:rgba(90,140,255,.12); border-color:rgba(90,140,255,.35); color:#bcd2ff}
.divider{height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); margin:22px 0}
.note{background:rgba(239,196,99,.06); border:1px dashed var(--line); border-radius:var(--rad2); padding:12px 15px; font-size:.9rem}
/* ============ 5. SECTION HEAD ============ */
.sec{padding:44px 0; position:relative}
.sec-h{margin-bottom:26px; position:relative}
.sec-h .tag{display:inline-block; color:var(--gl); font-weight:800; letter-spacing:3px; font-size:.75rem; text-transform:uppercase; margin-bottom:6px}
.sec-h h2 span{background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.sec-h .line{width:90px; height:4px; border-radius:4px; background:var(--grad); margin-top:10px}
.reveal{opacity:0; transform:translateY(34px); transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1)}
.reveal.on{opacity:1; transform:none}
/* ============ 6. LOGIN GATE ============ */
.gate{position:fixed; inset:0; z-index:900; display:grid; place-items:center; padding:22px; background:
  radial-gradient(ellipse at 50% 0%,rgba(224,27,43,.22),transparent 60%),
  radial-gradient(ellipse at 50% 100%,rgba(239,196,99,.14),transparent 60%),#05050a; overflow-y:auto}
.gate-spot{position:absolute; inset:0; background:conic-gradient(from 200deg at 50% -10%,transparent 0deg,rgba(255,255,255,.05) 20deg,transparent 40deg,transparent 320deg,rgba(255,255,255,.05) 340deg,transparent 360deg); animation:spot 9s linear infinite; pointer-events:none}
.gate-in{width:100%; max-width:470px; position:relative; z-index:3; text-align:center; animation:pop .7s cubic-bezier(.2,.8,.3,1)}
.gate-logo{width:104px; height:104px; margin:0 auto 12px; border-radius:28px; background:linear-gradient(145deg,#1a1014,#0c0c12); border:2px solid var(--line); display:grid; place-items:center; font-size:52px; box-shadow:0 0 0 6px rgba(224,27,43,.08),0 0 44px rgba(224,27,43,.35); animation:pulseGlow 3.6s ease-in-out infinite}
.gate h1{font-size:1.6rem; margin-bottom:2px}
.gate .sub{color:var(--gl); letter-spacing:4px; font-size:.72rem; font-weight:800; text-transform:uppercase}
.gate-card{background:rgba(14,14,22,.9); border:1px solid var(--line); border-radius:22px; padding:24px 22px; box-shadow:var(--sh); backdrop-filter:blur(14px); margin-top:20px; text-align:start}
.gate-foot{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap}
.mini{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.05); border:1px solid var(--line2); border-radius:999px; padding:6px 13px; cursor:pointer; font-size:.82rem; font-weight:700; transition:.25s}
.mini:hover{border-color:var(--gl); color:var(--gl)}
/* ============ 7. FORMS ============ */
.fld{margin-bottom:14px}
.fld > label{display:block; font-size:.85rem; font-weight:800; margin-bottom:6px; color:#e3ddd0}
.fld .hint{font-size:.74rem; color:var(--mut); font-weight:400; margin-top:4px}
.inp{width:100%; padding:12px 14px; border-radius:var(--rad2); background:#0d0d15; border:1px solid var(--line2); transition:.25s; outline:none}
.inp:focus{border-color:var(--gl); box-shadow:0 0 0 3px rgba(239,196,99,.12); background:#101018}
.inp::placeholder{color:#5f5a52}
select.inp{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--gl) 50%),linear-gradient(135deg,var(--gl) 50%,transparent 50%); background-position:calc(0% + 18px) 50%,calc(0% + 24px) 50%; background-size:6px 6px,6px 6px; background-repeat:no-repeat}
html[dir=ltr] select.inp{background-position:calc(100% - 18px) 50%,calc(100% - 24px) 50%}
textarea.inp{min-height:110px; resize:vertical; line-height:1.7}
.pass-wrap{position:relative}
.pass-wrap .eye{position:absolute; inset-inline-end:10px; top:50%; transform:translateY(-50%); cursor:pointer; background:none; border:0; font-size:18px; opacity:.7; padding:6px}
.pass-wrap .eye:hover{opacity:1}
.chk{display:flex; gap:9px; align-items:flex-start; font-size:.85rem; color:#d5cfc2}
.chk input{margin-top:6px; accent-color:var(--cr); width:17px; height:17px}
.err{color:#ff9aa4; font-size:.82rem; min-height:18px; margin-top:6px}
.ok{color:#a9f0c6; font-size:.86rem}
/* ============ 8. HEADER / NAV ============ */
.app{display:none}
.app.on{display:block}
header.top{position:sticky; top:0; z-index:120; background:rgba(8,8,13,.86); backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
.top-in{display:flex; align-items:center; gap:14px; height:var(--hh); max-width:1400px; margin:0 auto; padding:0 14px}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; flex:0 0 auto}
.brand .bg-logo{width:40px; height:40px; border-radius:12px; background:linear-gradient(145deg,#241014,#0d0d14); border:1px solid var(--line); display:grid; place-items:center; font-size:21px}
.brand b{display:block; font-size:.95rem; line-height:1.2}
.brand i{font-style:normal; font-size:.62rem; letter-spacing:2.6px; color:var(--gl); font-weight:700}
nav.main{flex:1; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:6px 2px}
nav.main::-webkit-scrollbar{display:none}
nav.main a{padding:8px 13px; border-radius:999px; font-size:.87rem; font-weight:700; color:#cfc9bd; white-space:nowrap; border:1px solid transparent; transition:.25s}
nav.main a:hover{color:var(--gl); background:rgba(239,196,99,.07)}
nav.main a.act{color:#1a0507; background:var(--grad); border-color:transparent}
.top-act{display:flex; align-items:center; gap:7px; flex:0 0 auto}
.ubox{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:999px; padding:4px 12px 4px 5px; cursor:pointer; font-size:.84rem; font-weight:700}
.ubox .av{width:30px; height:30px; border-radius:50%; background:var(--grad); color:#1a0507; display:grid; place-items:center; font-weight:900; font-size:.85rem}
.burger{display:none; background:none; border:1px solid var(--line); border-radius:11px; width:42px; height:40px; cursor:pointer; font-size:20px}
/* scroll progress */
.sprog{position:fixed; top:0; inset-inline-start:0; height:3px; width:0; background:var(--grad); z-index:200; transition:width .1s}
/* ============ 9. MARQUEE ============ */
.mq{display:flex; overflow:hidden; white-space:nowrap; border-block:1px solid var(--line); background:linear-gradient(90deg,rgba(224,27,43,.13),rgba(239,196,99,.06),rgba(224,27,43,.13)); padding:9px 0; position:relative; z-index:3}
.mq-in{display:inline-flex; animation:mq 30s linear infinite}
.mq-in.rev{animation-direction:reverse}
.mq span{padding:0 22px; font-weight:800; font-size:.82rem; color:var(--gl); letter-spacing:1.2px}
.mq span.sep{color:var(--cr); padding:0}
/* ============ 10. HERO ============ */
.hero{position:relative; padding:52px 0 40px; overflow:hidden}
.hero-in{display:grid; grid-template-columns:1.15fr .85fr; gap:30px; align-items:center}
.hero h1 .grad{background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.hero .eyebrow{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:5px 14px; font-size:.78rem; font-weight:800; color:var(--gl); background:rgba(239,196,99,.06); margin-bottom:14px}
.typed{border-inline-end:2px solid var(--gl); animation:caret 1s step-end infinite; padding-inline-end:3px}
.hero-photo{position:relative; border-radius:26px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--sh); aspect-ratio:4/5; background:#0e0e15}
.hero-photo img{width:100%; height:100%; object-fit:cover; object-position:center; filter:contrast(1.06) saturate(1.05)}
.hero-photo::after{content:""; position:absolute; inset:0; background:linear-gradient(to top,rgba(6,6,10,.88),transparent 55%)}
.hero-photo .cap{position:absolute; inset-inline:0; bottom:0; padding:18px; z-index:2}
.hero-badge{position:absolute; top:14px; inset-inline-start:14px; z-index:2; background:rgba(6,6,10,.75); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:.76rem; font-weight:800; color:var(--gl)}
.stat{border:1px solid var(--line); border-radius:var(--rad2); padding:14px 10px; text-align:center; background:rgba(255,255,255,.03)}
.stat b{display:block; font-size:clamp(1.3rem,3vw,1.9rem); background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.stat span{font-size:.74rem; color:var(--mut); font-weight:700}
/* ============ 11. PAGES / TABS ============ */
.page{display:none; animation:fadeUp .55s ease both}
.page.act{display:block}
/* ============ 12. TABLES ============ */
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--rad); background:var(--pnl)}
table.tbl{width:100%; border-collapse:collapse; min-width:640px; font-size:.88rem}
table.tbl th{background:rgba(239,196,99,.07); text-align:start; padding:12px 13px; font-size:.8rem; color:var(--gl); white-space:nowrap; border-bottom:1px solid var(--line)}
table.tbl td{padding:11px 13px; border-bottom:1px solid var(--line2); vertical-align:middle}
table.tbl tr:hover td{background:rgba(255,255,255,.025)}
table.tbl tr:last-child td{border-bottom:0}
.tbl-acts{display:flex; gap:6px; flex-wrap:wrap}
/* ============ 13. MODAL ============ */
.modal{position:fixed; inset:0; z-index:800; display:none; place-items:center; padding:16px; background:rgba(3,3,6,.82); backdrop-filter:blur(6px); overflow-y:auto}
.modal.on{display:grid}
.modal-box{width:100%; max-width:620px; background:linear-gradient(180deg,#13131c,#0d0d14); border:1px solid var(--line); border-radius:22px; padding:22px; box-shadow:var(--sh); animation:pop .4s cubic-bezier(.2,.8,.3,1); max-height:92vh; overflow-y:auto}
.modal-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.modal-h h3{margin:0}
.x{background:none; border:1px solid var(--line); border-radius:10px; width:36px; height:36px; cursor:pointer; font-size:17px; flex:0 0 auto}
.x:hover{color:var(--cr); border-color:var(--cr)}
/* ============ 14. ADMIN TABS ============ */
.tabs{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px}
.tabs button{padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--pnl3); font-weight:800; font-size:.85rem; cursor:pointer; transition:.25s}
.tabs button:hover{border-color:var(--gl)}
.tabs button.act{background:var(--grad); color:#1a0507; border-color:transparent}
/* ============ 15. MISC BLOCKS ============ */
.tl{position:relative; padding-inline-start:26px}
.tl::before{content:""; position:absolute; inset-inline-start:7px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--cr),var(--gl))}
.tl-item{position:relative; margin-bottom:18px}
.tl-item::before{content:""; position:absolute; inset-inline-start:-25px; top:7px; width:12px; height:12px; border-radius:50%; background:var(--gl); box-shadow:0 0 0 4px rgba(239,196,99,.14)}
.quote{border-inline-start:3px solid var(--gl); padding-inline-start:14px; font-style:italic; color:#ddd6c8}
.pay-card{border:1px solid var(--line); border-radius:var(--rad); padding:18px; background:linear-gradient(160deg,rgba(224,27,43,.10),rgba(255,255,255,.02))}
.copy-row{display:flex; align-items:center; gap:10px; background:#0d0d15; border:1px dashed var(--line); border-radius:var(--rad2); padding:10px 14px; justify-content:space-between; flex-wrap:wrap}
.copy-row b{font-family:ui-monospace,Consolas,monospace; font-size:1.05rem; letter-spacing:1px; color:var(--gl)}
.prog-card{border:1px solid var(--line); border-radius:var(--rad); overflow:hidden; background:var(--pnl)}
.prog-head{padding:16px; background:linear-gradient(135deg,rgba(224,27,43,.16),rgba(239,196,99,.06)); border-bottom:1px solid var(--line)}
.prog-body{padding:16px}
.ex-row{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line2); font-size:.88rem}
.ex-row:last-child{border-bottom:0}
.ex-row .r{color:var(--gl); font-weight:800; white-space:nowrap; font-size:.82rem}
.plan{border:1px solid var(--line); border-radius:var(--rad); padding:22px 18px; background:var(--pnl); position:relative; transition:.35s; text-align:center}
.plan:hover{transform:translateY(-7px); border-color:var(--gl)}
.plan.hot{border-color:var(--cr); box-shadow:0 16px 40px rgba(224,27,43,.22)}
.plan .rib{position:absolute; top:-12px; inset-inline-start:50%; transform:translateX(-50%); background:var(--grad); color:#1a0507; font-weight:900; font-size:.72rem; padding:4px 14px; border-radius:999px; white-space:nowrap}
.plan .pr{font-size:2rem; font-weight:900; background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.plan ul{list-style:none; padding:0; text-align:start; margin:14px 0; font-size:.88rem}
.plan li{padding:5px 0; border-bottom:1px dashed var(--line2)}
.plan li::before{content:"✔"; color:var(--gl); margin-inline-end:8px}
.store-hero{border:1px solid var(--line); border-radius:24px; padding:34px; text-align:center; background:radial-gradient(ellipse at 50% 0%,rgba(239,196,99,.14),transparent 62%),var(--pnl); position:relative; overflow:hidden}
.gal{aspect-ratio:1/1; border-radius:var(--rad2); border:1px solid var(--line); display:grid; place-items:center; font-size:40px; background:linear-gradient(145deg,rgba(224,27,43,.14),rgba(239,196,99,.07)); overflow:hidden}
.gal img{width:100%; height:100%; object-fit:cover}
.fab{position:fixed; inset-inline-end:16px; bottom:16px; z-index:150; display:flex; flex-direction:column; gap:10px; align-items:flex-end}
.fab button,.fab a{width:52px; height:52px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line); background:rgba(14,14,22,.9); color:var(--ink); font-size:21px; cursor:pointer; box-shadow:var(--sh2); backdrop-filter:blur(8px); transition:.28s}
.fab button:hover,.fab a:hover{transform:translateY(-3px) scale(1.06); border-color:var(--gl)}
.fab .wab{background:#0f2a1b; border-color:rgba(37,211,102,.5); color:#b8f5cf}
footer.ft{border-top:1px solid var(--line); background:rgba(8,8,13,.7); padding:34px 0 26px; margin-top:30px; position:relative; z-index:3}
.ft-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:22px}
.ft a{color:#cfc9bd; font-size:.88rem}
.ft a:hover{color:var(--gl)}
.punch{position:fixed; width:120px; height:120px; border-radius:50%; pointer-events:none; z-index:999; transform:translate(-50%,-50%); background:radial-gradient(circle,rgba(239,196,99,.34),transparent 62%); animation:punchOut .55s ease-out forwards}
/* ============ 16. KEYFRAMES ============ */
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(5vw,-4vh) scale(1.1)}66%{transform:translate(-4vw,3vh) scale(.95)}}
@keyframes rope{0%,100%{transform:translateY(0); opacity:.35}50%{transform:translateY(-9px); opacity:.85}}
@keyframes float{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-40px) rotate(12deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes spot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 6px rgba(224,27,43,.08),0 0 34px rgba(224,27,43,.28)}50%{box-shadow:0 0 0 12px rgba(239,196,99,.07),0 0 60px rgba(224,27,43,.5)}}
@keyframes pop{from{opacity:0; transform:scale(.94) translateY(14px)}to{opacity:1; transform:none}}
@keyframes fadeUp{from{opacity:0; transform:translateY(18px)}to{opacity:1; transform:none}}
@keyframes caret{50%{border-color:transparent}}
@keyframes punchOut{from{opacity:.9; transform:translate(-50%,-50%) scale(.2)}to{opacity:0; transform:translate(-50%,-50%) scale(1.6)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .4s}
@keyframes spinSlow{to{transform:rotate(360deg)}}
/* ============ 16b. PLAYER PERSONAL SYSTEM ============ */
.me-hero{border:1px solid var(--line); border-radius:var(--rad); padding:20px; background:linear-gradient(135deg,rgba(224,27,43,.16),rgba(239,196,99,.07) 60%,rgba(255,255,255,.02)); position:relative; overflow:hidden}
.me-hero .row{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.me-av{width:74px; height:74px; border-radius:20px; background:var(--grad); color:#1a0507; display:grid; place-items:center; font-size:2rem; font-weight:900; flex:0 0 auto}
.me-stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:16px}
.me-stats .stat{padding:11px 8px}
.me-stats .stat b{font-size:clamp(1.1rem,2.6vw,1.5rem)}
.bar{height:9px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid var(--line2)}
.bar i{display:block; height:100%; background:var(--grad); border-radius:999px; transition:width .8s ease}
.bar-lbl{display:flex; justify-content:space-between; font-size:.78rem; font-weight:700; color:var(--mut); margin:12px 0 5px}
.dot-grid{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.dot{width:26px; height:26px; border-radius:9px; display:grid; place-items:center; font-size:.62rem; font-weight:800; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--mut)}
.dot.on{background:rgba(40,200,120,.16); border-color:rgba(40,200,120,.42); color:#a9f0c6}
.dash{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; margin-top:8px}
.dash .d{aspect-ratio:1/1; border-radius:8px; border:1px solid var(--line2); background:rgba(255,255,255,.03); display:grid; place-items:center; font-size:.6rem; color:var(--mut); font-weight:700}
.dash .d.on{background:linear-gradient(145deg,rgba(224,27,43,.55),rgba(239,196,99,.35)); border-color:transparent; color:#fff}
.badges{display:flex; flex-wrap:wrap; gap:8px}
.badge{display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.03); font-size:.78rem; font-weight:800; color:var(--mut)}
.badge.on{background:linear-gradient(145deg,rgba(239,196,99,.18),rgba(224,27,43,.14)); border-color:rgba(239,196,99,.42); color:var(--gl)}
.note-item{border-inline-start:3px solid var(--cr); background:rgba(255,255,255,.03); border-radius:0 12px 12px 0; padding:10px 13px; margin-bottom:9px}
html[dir=ltr] .note-item{border-radius:12px 0 0 12px}
.note-item .d{font-size:.7rem; color:var(--mut); font-weight:700}
.chart{width:100%; height:120px; display:block}
.chart .ln{fill:none; stroke:url(#gr); stroke-width:2.5; stroke-linejoin:round}
.chart .pt{fill:#efc463}
.chart .gl{stroke:rgba(255,255,255,.08); stroke-width:1}
.lock-card{border:1px dashed var(--line); border-radius:var(--rad); padding:20px; background:rgba(224,27,43,.06); text-align:center}
/* ============ 17. RESPONSIVE (fluid: desktop + tablet + phone) ============ */
*{min-width:0}
img,svg,video,canvas{max-width:100%}
.grid,.flex,.ex-row,.copy-row{min-width:0}
@media(max-width:1100px){
  .me-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1000px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-in{grid-template-columns:1fr}
  .hero-photo{max-width:420px; margin:0 auto; aspect-ratio:1/1}
  .ft-grid{grid-template-columns:1fr 1fr}
  .sec{padding:38px 0}
  nav.main{display:none}
  nav.main.open{display:flex; position:absolute; top:var(--hh); inset-inline:0; background:#0a0a11; border-bottom:1px solid var(--line); flex-direction:column; padding:12px; gap:6px; z-index:130; max-height:70vh; overflow-y:auto}
  .burger{display:block}
  .tabs{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; scrollbar-width:thin}
  .tabs button{flex:0 0 auto; white-space:nowrap}
}
@media(max-width:820px){
  .g2{grid-template-columns:1fr}
  .top-in{padding:0 10px; gap:9px}
  .sec-h h2{font-size:clamp(1.3rem,4.6vw,1.9rem)}
  .plan .pr{font-size:2.1rem}
}
@media(max-width:620px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .ft-grid{grid-template-columns:1fr}
  body{font-size:15px}
  .sec{padding:26px 0}
  .wrap{padding:0 12px}
  .brand b{font-size:.82rem}
  .brand i{font-size:.52rem; letter-spacing:1.8px}
  .brand .bg-logo{width:36px; height:36px; font-size:19px}
  .modal-box{padding:16px; border-radius:18px; max-height:88vh; overflow-y:auto}
  .store-hero{padding:22px 14px}
  .ubox .un{display:none}
  .ubox{padding:4px 8px 4px 4px}
  .card{padding:15px}
  .btn{padding:10px 15px; font-size:.86rem}
  .btn.lg{padding:12px 18px; font-size:.94rem}
  .copy-row b{font-size:.94rem}
  .ex-row{flex-wrap:wrap}
  .ex-row .r{font-size:.78rem}
  .gate-in{padding:20px 14px}
  .me-hero{padding:16px}
  .me-av{width:60px; height:60px; font-size:1.6rem; border-radius:16px}
  .me-stats{gap:8px; margin-top:13px}
  .dash{grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px}
  .dash .d{font-size:.52rem; border-radius:6px}
  table.tbl{min-width:520px; font-size:.82rem}
  .prog-head,.prog-body{padding:13px}
  .btn.lg.blk,.btn.blk{width:100%}
}
@media(max-width:400px){
  body{font-size:14.5px}
  .brand b{font-size:.74rem}
  .brand i{display:none}
  .chip{font-size:.72rem; padding:3px 9px}
  .me-stats{grid-template-columns:1fr 1fr}
  .dash .d{font-size:0}
}
@media print{.bgfx,.fab,header.top,.mq,.tabs,.tbl-acts{display:none}}
</style>
</head>
<body>
<!-- ============ BACKGROUND FX ============ -->
<div class="bgfx" aria-hidden="true">
  <i class="fx-grid"></i>
  <i class="fx-glow a"></i><i class="fx-glow b"></i><i class="fx-glow c"></i>
  <i class="fx-mist"></i>
  <i class="rope r1"></i><i class="rope r2"></i><i class="rope r3"></i>
  <span class="glove-float" style="top:10%;inset-inline-start:6%;animation-delay:0s">🥊</span>
  <span class="glove-float" style="top:28%;inset-inline-end:9%;animation-delay:3s">🥊</span>
  <span class="glove-float" style="top:58%;inset-inline-start:14%;animation-delay:6s">🏆</span>
  <span class="glove-float" style="top:74%;inset-inline-end:16%;animation-delay:9s">🥊</span>
  <span class="glove-float" style="top:44%;inset-inline-start:78%;animation-delay:12s">⏱️</span>
</div>
<div class="sprog" id="sprog"></div>

<!-- ============ LOGIN GATE ============ -->
<div class="gate" id="gate">
  <div class="gate-spot"></div>
  <div class="gate-in">
    <div class="gate-logo">🥊</div>
    <div class="sub">CAP · EYAD EL-SHERBENI</div>
    <h1>نادي الكابتن إياد الشربيني</h1>
    <p class="mut sm" data-i18n="gate.sub">أكاديمية الملاكمة — بوابتك إلى عالم الحلبة. سجّل دخولك للوصول إلى برامجك وبياناتك.</p>

    <div id="gateRegView" class="hide" style="text-align:start;margin:16px 0 0">
      <button class="btn sm" id="gateBack">⬅️ <span data-i18n="btn.backlogin">رجوع لتسجيل الدخول</span></button>
      <div id="gateRegSlot" style="margin-top:12px"></div>
    </div>
    <div id="gateLoginView">
    <div class="gate-card">
      <form id="loginForm" autocomplete="off">
        <div class="fld">
          <label for="lu" data-i18n="f.username">اسم المستخدم (اسم اللاعب)</label>
          <input class="inp" id="lu" type="text" placeholder="اسم المستخدم" autocomplete="username" required>
          <div class="hint" data-i18n="gate.u.hint">اكتب اسمك كما هو مسجَّل بالعربية أو بالإنجليزية، ثم كلمة المرور الخاصة بك.</div>
        </div>
        <div class="fld">
          <label for="lp" data-i18n="f.password">كلمة المرور</label>
          <div class="pass-wrap">
            <input class="inp" id="lp" type="password" dir="ltr" placeholder="••••••••" autocomplete="current-password" required>
            <button class="eye" type="button" data-eye="lp" title="إظهار">👁️</button>
          </div>
        </div>
        <div class="chk" style="margin-bottom:12px">
          <input type="checkbox" id="lgree" checked>
          <label for="lgree" data-i18n="gate.terms">أتعهد بالالتزام بقواعد النادي وتعليمات الكابتن.</label>
        </div>
        <div class="err" id="loginErr"></div>
        <button class="btn p blk lg" type="submit" id="loginBtn" data-i18n="btn.login">دخول إلى النادي</button>
      </form>
      <div class="divider"></div>
      <div class="flex center" style="gap:8px">
        <button class="btn sm" id="gateNewReg" data-go="register" data-i18n="btn.newreg">تسجيل اشتراك جديد</button>
        <button class="btn sm w" id="gateWa" data-i18n="btn.wa">تواصل واتساب</button>
      </div>
      <p class="xs mut tc mt2 mb0" data-i18n="gate.note">لا تملك حسابًا؟ اضغط «تسجيل اشتراك جديد» وأكمل بياناتك، وسيصل إشعار بالاشتراك للكابتن على واتساب فورًا.</p>
    </div>
    </div><!-- /gateLoginView -->

    <div class="gate-foot">
      <span class="mini" id="gateLang">🌐 <span>English</span></span>
      <span class="mini" id="gateSound">🔊 <span data-i18n="btn.sound">صوت النقر</span></span>
      <span class="mini" data-go="store">🛒 <span data-i18n="nav.store">متجر الكابتن</span></span>
    </div>
    <p class="xs mut mt2" style="opacity:.75">© <span class="yr"></span> Cap Eyad El-Sherbeni Boxing Club — All rights reserved.</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
<header class="top">
  <div class="top-in">
    <div class="brand" data-go="home">
      <span class="bg-logo">🥊</span>
      <span><b>الكابتن إياد الشربيني</b><i>CAP EYAD EL-SHERBENI</i></span>
    </div>
    <button class="burger" id="burger" aria-label="menu">☰</button>
    <nav class="main" id="nav">
      <a data-page="home" class="act" data-i18n="nav.home">الرئيسية</a>
      <a data-page="about" data-i18n="nav.about">عن الكابتن</a>
      <a data-page="programs" data-i18n="nav.programs">البرامج التدريبية</a>
      <a data-page="schedule" data-i18n="nav.schedule">جدول التدريبات</a>
      <a data-page="champions" data-i18n="nav.champions">الأبطال</a>
      <a data-page="plans" data-i18n="nav.plans">الاشتراكات والدفع</a>
      <a data-page="data" data-i18n="nav.data">بيانات اللاعبين</a>
      <a data-page="register" data-i18n="nav.register">تسجيل لاعب</a>
      <a data-page="store" data-i18n="nav.store">المتجر</a>
      <a data-page="contact" data-i18n="nav.contact">تواصل</a>
      <a data-page="admin" class="adm-only hide" data-i18n="nav.admin">لوحة الإدارة</a>
    </nav>
    <div class="top-act">
      <span class="mini" id="langBtn" title="Language">🌐 AR</span>
      <span class="mini" id="soundBtn" title="Sound">🔊</span>
      <span class="ubox" data-go="profile" title="ملفي">
        <span class="av" id="uav">؟</span>
        <span class="un" id="uname">لاعب</span>
      </span>
      <button class="mini" id="logoutBtn" data-i18n="btn.logout" title="خروج">🚪 <span data-i18n="btn.logout">خروج</span></button>
    </div>
  </div>
</header>

<div class="mq"><div class="mq-in" id="mq1"></div></div>

<main class="wrap">
<!-- ===== HOME ===== -->
<section class="page act" id="p-home">
  <div class="hero">
    <div class="hero-in">
      <div>
        <span class="eyebrow">🔥 <span data-i18n="home.eyebrow">أكاديمية ملاكمة · انضباط · قوة · إرادة</span></span>
        <h1><span data-i18n="home.h1a">ادخل عالم الملاكمة مع</span> <span class="grad">الكابتن إياد الشربيني</span></h1>
        <p class="lead" id="heroTyped"><span class="typed" id="typedText"></span></p>
        <p data-i18n="home.p">تدريب احترافي مبني على أصول الملاكمة: وقفة صحيحة، حركة قدمين، لكمات مركّبة، دفاع، لياقة بدنية، وإعداد نفسي داخل الحلبة. هنا تُصنع الأبطال خطوة بخطوة.</p>
        <div class="flex mt2">
          <button class="btn p lg" data-go="register" data-i18n="btn.join">اشترك الآن</button>
          <button class="btn lg" data-go="programs" data-i18n="btn.viewprog">شاهد البرامج التدريبية</button>
          <button class="btn lg w" id="homeWa" data-i18n="btn.wa2">واتساب الكابتن</button>
        </div>
        <div class="grid g4 mt3" id="statBar">
          <div class="stat"><b data-count="15">0</b><span data-i18n="stat.y">سنوات خبرة تدريبية</span></div>
          <div class="stat"><b data-count="40">0</b><span data-i18n="stat.c">أبطال تم تدريبهم</span></div>
          <div class="stat"><b data-count="25">0</b><span data-i18n="stat.t">بطولات محلية ودولية</span></div>
          <div class="stat"><b data-count="200">0</b><span data-i18n="stat.s">حصة تدريبية</span></div>
        </div>
      </div>
      <div class="hero-photo" id="heroPhoto">
        <span class="hero-badge" data-i18n="home.badge">الكابتن · مدرب الملاكمة</span>
        <img id="coachImg" src="https://sc04.alicdn.com/kf/A0a84c55748d040b6a2825bd66cf771cfb.jpg" alt="الكابتن إياد الشربيني">
        <div class="cap">
          <b style="font-size:1.1rem">الكابتن إياد الشربيني</b>
          <div class="sm mut">Cap Eyad El-Sherbeni — Head Coach</div>
        </div>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h reveal"><span class="tag" data-i18n="home.tag1">لماذا نحن</span><h2 data-i18n="home.why">لماذا <span>نادي الكابتن إياد</span>؟</h2><div class="line"></div></div>
    <div class="grid g3">
      <div class="card reveal"><div class="ico">🥊</div><h3 data-i18n="w1.t">تدريب فنّي متكامل</h3><p class="sm mut" data-i18n="w1.d">من الوقفة الأساسية حتى اللكمات المركّبة والدفاع الذكي، بمنهج واضح يبني المهارة خطوة بخطوة.</p></div>
      <div class="card reveal"><div class="ico">💪</div><h3 data-i18n="w2.t">إعداد بدني قوي</h3><p class="sm mut" data-i18n="w2.d">لياقة، تحمّل، قوة انفجارية، وسرعة يدين — برامج مصمّمة لكل مستوى وللأعمار المختلفة.</p></div>
      <div class="card reveal"><div class="ico">🧠</div><h3 data-i18n="w3.t">إعداد نفسي</h3><p class="sm mut" data-i18n="w3.d">الثقة، التركيز، والهدوء تحت الضغط. الملاكمة لعبة عقل قبل أن تكون لعبة عضلات.</p></div>
      <div class="card reveal"><div class="ico">🏆</div><h3 data-i18n="w4.t">مسار بطولات</h3><p class="sm mut" data-i18n="w4.d">اختيار اللاعبين المتميزين للمشاركة في البطولات المحلية والدولية والاستعداد لها بخطة خاصة.</p></div>
      <div class="card reveal"><div class="ico">📋</div><h3 data-i18n="w5.t">متابعة فردية</h3><p class="sm mut" data-i18n="w5.d">لكل لاعب ملف بيانات ووزن ومستوى وتقارير متابعة يطّلع عليها الكابتن أولًا بأول.</p></div>
      <div class="card reveal"><div class="ico">🛡️</div><h3 data-i18n="w6.t">سلامة وأمان</h3><p class="sm mut" data-i18n="w6.d">تسخين وإطالة صحيحة، أدوات حماية، وتدرّج آمن في التحميل حتى في جلسات السبارينج.</p></div>
    </div>
  </div>

  <div class="sec">
    <div class="grid g2">
      <div class="card reveal">
        <div class="sec-h"><span class="tag" data-i18n="home.tag2">إعلانات</span><h2 data-i18n="home.news">آخر <span>أخبار النادي</span></h2><div class="line"></div></div>
        <div id="annList"></div>
      </div>
      <div class="card reveal">
        <div class="sec-h"><span class="tag" data-i18n="home.tag3">باقات</span><h2 data-i18n="home.plans">اشتراكات <span>تناسب الجميع</span></h2><div class="line"></div></div>
        <div id="planMini" class="grid g2"></div>
        <button class="btn p mt2" data-go="plans" data-i18n="btn.allplans">كل الباقات والدفع</button>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h tc reveal"><span class="tag" data-i18n="home.tag4">أبطالنا</span><h2 data-i18n="home.champ">نجوم <span>الحلبة</span></h2><div class="line" style="margin:10px auto 0"></div></div>
    <div class="grid g3" id="champMini"></div>
  </div>

  <div class="sec">
    <div class="store-hero reveal">
