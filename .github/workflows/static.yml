let AR_SNAP = null;
function applyLang(lang){
  S.lang = lang || 'ar';
  const html = document.documentElement;
  html.lang = S.lang; html.dir = S.lang==='en' ? 'ltr' : 'rtl';
  if(!AR_SNAP){
    AR_SNAP = {};
    $$('[data-i18n]').forEach(el=>{ AR_SNAP[el.getAttribute('data-i18n')] = el.innerHTML; });
  }
  $$('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(S.lang==='en' && EN[k]!==undefined) el.innerHTML = EN[k];
