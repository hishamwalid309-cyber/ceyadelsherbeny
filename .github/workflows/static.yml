      rows.map(function(x){ return '<tr><td>'+esc(x.d)+'</td><td>'+esc(x.plan||'')+'</td><td>'+esc(x.method||'')+'</td><td>'+esc(x.amount||'')+'</td><td dir="ltr">'+esc(x.ref||'—')+'</td></tr>'; }).join('')+
      '</tbody></table></div>'
      : '<p class="sm mut mb0">'+esc(L('لا توجد دفعات مسجَّلة.','No payments recorded.'))+'</p>')+
