/* ---------- admin: attendance ---------- */
function attDay(){ const el=$('#attDate'); return (el&&el.value)||today(); }
function tickAtt(id, day){
  const p=(DB.players||[]).find(x=>x.id===id); if(!p) return;
  p.attend=p.attend||[];
  const i=p.attend.indexOf(day);
  if(i>-1){ p.attend.splice(i,1); p.points=Math.max(0,(p.points||0)-2); }
  else{ p.attend.push(day); p.points=(p.points||0)+2; }
  if(!S.isAdmin && S.user && S.user.id===id) S.user=p;
  saveDB(); renderAll();
}
function renderAttendance(){
  const el=$('#attTbl'); if(!el) return;
  const dt=$('#attDate'); if(dt && !dt.value) dt.value=today();
  const day=attDay(), pls=DB.players||[];
  const present=pls.filter(p=>(p.attend||[]).indexOf(day)>-1).length;
  const st=$('#attStats');
  if(st) st.innerHTML=[
    ['👥', pls.length, L('إجمالي اللاعبين','Total players')],
    ['✅', present, L('حضور هذا اليوم','Present')],
    ['❌', Math.max(0,pls.length-present), L('غائب','Absent')],
    ['📊', pls.reduce(function(a,p){ return a+(p.attend||[]).length; },0), L('إجمالي الحصص','Total sessions')]
  ].map(function(s){ return '<div class="stat"><b>'+s[1]+'</b><span>'+esc(s[2])+'</span></div>'; }).join('');
  buildTbl('#attTbl',[t('th.name'),t('th.user'),t('th.phone'),L('حصص','Sessions'),L('متتالي','Streak'),L('آخر حضور','Last'),L('نقاط','Points'),L('حالة اليوم','Today'),t('th.act')],
    pls.map(function(p){
      const on=(p.attend||[]).indexOf(day)>-1;
      return ['<b>'+esc(p.nameAr)+'</b>', '<span dir="ltr">'+esc(p.username)+'</span>', '<span dir="ltr">'+esc(p.phone||'')+'</span>',
        String((p.attend||[]).length), String(streakOf(p)), esc((p.attend||[]).slice().sort().pop()||'—'), String(p.points||0),
        (on?'<span class="chip gr">✅ '+L('حاضر','Present')+'</span>':'<span class="chip rd">❌ '+L('غائب','Absent')+'</span>'),
        '<div class="tbl-acts"><button class="btn sm '+(on?'d':'g')+'" data-attd="'+p.id+'">'+(on?'✖️ '+L('إلغاء','Undo'):'✅ '+L('تسجيل حضور','Mark present'))+'</button>'+
        '<button class="btn sm w" data-wap="'+p.id+'">💬</button></div>'];
    }), t('msg.noplayers'));
}

/* ---------- admin: billing / renewals ---------- */
function renewOpts(){
  return [['30',L('شهر واحد (30 يوم)','1 month (30 days)')],['90',L('3 شهور (90 يوم)','3 months (90 days)')],
    ['180',L('6 شهور (180 يوم)','6 months (180 days)')],['365',L('سنة كاملة (365 يوم)','Full year (365 days)')]];
}
function renderBilling(){
  const el=$('#billTbl'); if(!el) return;
  const q=(($('#billSearch')&&$('#billSearch').value)||'').trim().toLowerCase();
  const all=DB.players||[];
  const pls=all.filter(function(p){ return !q || [p.nameAr,p.nameEn,p.username,p.phone,p.plan].join(' ').toLowerCase().indexOf(q)>-1; });
  const act=all.filter(function(p){ return p.status==='active'; }).length;
  const expired=all.filter(function(p){ const d=daysLeft(p); return p.status==='expired'||(d!==null&&d<0); }).length;
  const soon=all.filter(function(p){ const d=daysLeft(p); return d!==null&&d>=0&&d<=7; }).length;
  const money=all.reduce(function(a,p){ return a+(p.payments||[]).reduce(function(b,x){ return b+(Number(x.amount)||0); },0); },0);
  const st=$('#billStats');
  if(st) st.innerHTML=[
    ['✅', act, L('اشتراكات نشطة','Active')],
    ['⚠️', soon, L('تنتهي خلال أسبوع','Expiring in 7 days')],
    ['⌛', expired, L('منتهية','Expired')],
    ['💰', money, L('إجمالي المحصَّل (ج.م)','Total collected (EGP)')]
  ].map(function(s){ return '<div class="stat"><b>'+s[1]+'</b><span>'+esc(s[2])+'</span></div>'; }).join('');
  buildTbl('#billTbl',[t('th.name'),t('th.plan'),t('th.status'),L('البداية','Start'),t('th.exp'),L('باقي','Left'),L('دفعات','Payments'),t('th.act')],
    pls.map(function(p){
      const d=daysLeft(p);
      return ['<b>'+esc(p.nameAr)+'</b><div class="xs mut" dir="ltr">'+esc(p.username)+'</div>', esc(p.plan||''), subChip(p),
        esc(p.startedAt||'—'), esc(p.expiry||L('مفتوح','Open')),
        (d===null?'—':(d+' '+L('يوم','d'))), String((p.payments||[]).length),
        '<div class="tbl-acts">'+
          '<button class="btn sm bl" data-renew="'+p.id+'">💳 '+L('تجديد','Renew')+'</button>'+
          '<button class="btn sm g" data-paid="'+p.id+'">💰 '+L('دفعة','Payment')+'</button>'+
          '<button class="btn sm" data-hist="'+p.id+'">🧾 '+L('السجل','History')+'</button>'+
        '</div>'];
    }), t('msg.noplayers'));
}
function renewPlayer(id){
  const p=(DB.players||[]).find(x=>x.id===id); if(!p) return;
  openEdit(L('تجديد اشتراك — ','Renew — ')+p.nameAr, [
    {k:'dur', l:L('مدة التجديد','Renewal duration'), t:'select', o:renewOpts()},
    {k:'mode', l:L('حساب البداية','Start from'), t:'select', o:[['add',L('إضافة المدة على الانتهاء الحالي','Add to current expiry')],['new',L('بدء من اليوم','Start from today')]]},
    {k:'plan', l:t('th.plan'), t:'select', o:PLANS},
    {k:'amount', l:L('المبلغ المدفوع (ج.م)','Amount paid (EGP)')},
    {k:'method', l:t('th.pay'), t:'select', o:PAYS},
    {k:'ref', l:t('th.ref')},
    {k:'status', l:t('th.status'), t:'select', o:STATUS_OPTS}
  ], {dur:'30', mode:'add', plan:planById(p.plan), amount:DB.settings.price1, method:p.payMethod||'إنستاباي', ref:'', status:'active'},
  function(o){
    const dur=Number(o.dur)||30;
    const cur=daysLeft(p);
    const base=(o.mode==='new'||!p.expiry||(cur!==null&&cur<0))? today() : p.expiry;
    p.expiry=addDays(base,dur);
    if(o.mode==='new') p.startedAt=today();
    p.plan=o.plan||p.plan; p.status=o.status||'active';
    p.payments=p.payments||[];
    p.payments.push({d:today(), plan:p.plan, amount:o.amount||'', method:o.method||'', ref:o.ref||''});
    p.coachNotes=p.coachNotes||[];
    p.coachNotes.push({d:today(), t:L('تم تجديد الاشتراك حتى ','Subscription renewed until ')+p.expiry+L(' بإجمالي ',' — total ')+(o.amount||'0')+L(' ج.م',' EGP')});
    if(!p.attend) p.attend=[];
    saveDB(); renderAll();
    ok('💳', L('تم التجديد','Renewed'), '<p class="sm">'+esc(p.nameAr)+' — '+esc(p.expiry)+'</p>',
      [{l:'💬 '+L('إرسال تأكيد للاعب','Send confirmation'), p:true, fn:function(){
          msgToPlayer(p, (L('تم تجديد اشتراكك في نادي الكابتن إياد الشربيني ✅','Your subscription at Cap Eyad Boxing Club has been renewed ✅'))+'\n\n'+
            L('الباقة: ','Package: ')+(p.plan||'')+'\n'+L('صالح حتى: ','Valid until: ')+p.expiry+'\n'+L('بالتوفيق يا بطل 🥊','Good luck champion 🥊'));
      }},
      {l:L('لاحقًا','Later')}]);
  });
}
