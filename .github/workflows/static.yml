/* ---------- one-time registration lock ---------- */
function regLocked(){
  const r=DB.reg||{};
  return !!(r.enabled && r.done);
}
function renderRegLock(){
  const lock=$('#regLock'), wrap=$('#regWrap'), btn=$('#gateNewReg');
  const locked=regLocked(), r=DB.reg||{};
  if(lock){
    if(locked){
      lock.innerHTML='<div class="lock-card reveal"><div class="ico lg">🔒</div>'+
        '<h3>'+esc(L('التسجيل متاح مرة واحدة فقط','Registration is allowed once only'))+'</h3>'+
        '<p class="sm mut mb0">'+esc(L('تم تسجيل حساب لاعب من هذا الجهاز بالفعل:','A player account has already been registered from this device:'))+
        ' <b dir="ltr">'+esc(r.username||'')+'</b> · '+esc(r.date||'')+'<br>'+
        esc(L('يمكنك الدخول باسم المستخدم وكلمة المرور في أي وقت. وإذا أردت تسجيل لاعب آخر، اطلب من الكابتن فتح التسجيل مرة أخرى من لوحة الإدارة.','You can sign in any time with your username and password. To register another player, ask the coach to re-open registration from the admin panel.'))+'</p>'+
        '<button class="btn p mt2" id="regGoLogin">🔑 '+esc(L('الذهاب لتسجيل الدخول','Go to login'))+'</button></div>';
    } else { lock.innerHTML=''; }
  }
  if(wrap) wrap.style.display = locked? 'none':'';
  if(btn){
    btn.textContent = locked? '🔒 '+L('التسجيل مُغلق','Registration closed') : '📝 '+L('تسجيل اشتراك جديد','New subscription');
    btn.setAttribute('data-locked', locked?'1':'');
  }
  const st=$('#regStateTxt');
  if(st) st.textContent = locked? (L('تم التسجيل — مغلق','Registered — closed')) : (r.enabled? L('مفتوح (مرة واحدة)','Open (once)') : L('مفتوح دائمًا','Always open'));
  const ro=$('#setRegOnce'); if(ro && document.activeElement!==ro) ro.checked = !!r.enabled;
}
function applySettings(){
  const s=DB.settings;
  const set=function(sel,v){ const el=$(sel); if(el) el.textContent=v; };
  set('#instaNum',s.insta); set('#vodaNum',s.voda); set('#instaNum2',s.insta); set('#vodaNum2',s.voda);
  set('#ctPhone',s.phone||s.insta); set('#ctPhone2',s.phone||s.voda); set('#aboutPhone',s.phone||s.insta);
  const img=$('#coachImg'); if(img && s.photo) img.src=s.photo;
  const ad=$('#ctAddress'); if(ad) ad.textContent=s.address||'';
  const h1=document.querySelector('#p-home .hero h1');
  if(h1 && s.hero){ h1.innerHTML='<span>'+esc(s.hero)+'</span> <span class="grad">'+esc(S.lang==='en'?'Coach Eyad El-Sherbeni':'الكابتن إياد الشربيني')+'</span>'; }
  const gw=$('#fabWa'); if(gw) gw.href='https://wa.me/'+waPhone()+'?text='+encodeURIComponent(S.lang==='en'?'Hello Coach Eyad, I would like to ask about training.':'السلام عليكم كابتن إياد، أريد الاستفسار عن التدريب.');
  const gal=$('#storeGal');
  if(gal){
    const urls=String(s.gallery||'').split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
    const icons=['🥊','🧵','🎽','🏋️','🏆','⏱️','🛡️','💪'];
    gal.innerHTML = urls.length? urls.map(u=>'<div class="gal"><img src="'+esc(u)+'" alt="store"></div>').join('')
      : icons.map(i=>'<div class="gal">'+i+'</div>').join('');
  }
}

/* ---------- auth ---------- */
function loginResult(u,p){
  const adm=(DB.admins&&DB.admins[0])||{};
  const nu=normUser(u);
  const names=[normUser(adm.username)].concat((adm.aliases||[]).map(normUser));
  if(nu && names.indexOf(nu)>-1){
    if(p===adm.password) return {admin:true};
    return {err:(S.lang==='en'?'Coach password is incorrect.':'كلمة مرور الكابتن غير صحيحة.')};
  }
  /* the username is the player's own name — accept the Arabic or the English form */
  const pl=(DB.players||[]).find(function(x){
    return normUser(x.username)===nu || normUser(x.nameEn)===nu || normUser(x.nameAr)===nu;
  });
  if(!pl) return {err:(S.lang==='en'?'This name is not registered. Ask the coach to create your account, or register a new subscription.':'الاسم غير مسجَّل. اطلب من الكابتن إنشاء حسابك أو سجّل اشتراكًا جديدًا.')};
  if(String(pl.password)!==String(p)) return {err:(S.lang==='en'?'Wrong password.':'كلمة المرور غير صحيحة.')};
  return {player:pl};
}
function afterLogin(){
  gateHome();
  $('#gate').style.display='none';
  $('#app').classList.add('on');
  $$('.adm-only').forEach(e=>e.classList.toggle('hide', !S.isAdmin));
  const u=S.user||{};
  $('#uav').textContent=(u.nameAr||u.username||'؟').charAt(0);
  $('#uname').textContent=S.isAdmin?(S.lang==='en'?'Coach Eyad':'الكابتن إياد'):(u.nameAr||u.username);
  renderAll(); applySettings();
  welcome();
  showPage(S.isAdmin?'home':'home', true);
  counters();
}
function welcome(){
  const u=S.user||{};
  $('#welcomeT').innerHTML = S.isAdmin ? '👑 '+esc(S.lang==='en'?'Welcome Coach Eyad':'أهلاً كابتن إياد') : '👋 '+esc(S.lang==='en'?'Welcome':'أهلاً بك يا')+' '+esc(u.nameAr||u.username);
  let b='';
  if(S.isAdmin){
    b='<p class="sm mut">'+esc(S.lang==='en'?'You are signed in as the club owner / head coach. You can edit every part of the site.':'أنت مسجَّل كصاحب النادي والمدرب الرئيسي. لك صلاحية كاملة لتعديل كل شىء في الموقع.')+'</p>'+
      '<div class="flex"><span class="chip">👥 '+esc((DB.players||[]).length)+' '+esc(S.lang==='en'?'players':'لاعب')+'</span><span class="chip">📋 '+esc((DB.programs||[]).length)+' '+esc(S.lang==='en'?'programs':'برنامج')+'</span><span class="chip">📨 '+esc((DB.requests||[]).length)+' '+esc(S.lang==='en'?'requests':'طلب')+'</span></div>';
  } else {
    b='<p class="sm mut">'+esc(S.lang==='en'?'Your account is ready. Your data is saved automatically on the site and the coach can see it.':'حسابك جاهز. بياناتك محفوظة تلقائيًا في الموقع ويطّلع عليها الكابتن.')+'</p>'+
      '<div class="flex"><span class="chip">'+esc(t('th.plan'))+': '+esc(u.plan||'—')+'</span>'+stChip(u.status)+'</div>';
  }
  b+='<div class="note sm mt2">🔊 '+esc(S.lang==='en'?'A subtle boxing click sound is on — turn it off any time from the sound button.':'صوت بوكس خفيف يعمل عند النقر — يمكنك إيقافه في أي وقت من زر الصوت.')+'</div>';
  $('#welcomeB').innerHTML=b;
  openModal('welcomeModal');
}
function logout(){
  S.user=null; S.isAdmin=false;
  $('#app').classList.remove('on');
  const g=$('#gate'); g.style.display='grid';
  $('#lu').value=''; $('#lp').value=''; $('#loginErr').textContent='';
  gateHome();
}
function gateHome(){
  const main=document.querySelector('main.wrap'), sec=$('#p-register');
  if(sec && main && sec.parentElement!==main) main.appendChild(sec);
  if(sec) sec.classList.remove('act');
  const lv=$('#gateLoginView'), rv=$('#gateRegView');
  if(lv) lv.classList.remove('hide');
  if(rv) rv.classList.add('hide');
}
function guestRegister(){
  const main=document.querySelector('main.wrap'), slot=$('#gateRegSlot'), sec=$('#p-register');
  if(!slot||!sec) return;
  if(regLocked()){
    ok('🔒', L('التسجيل مُغلق','Registration closed'),
      esc(L('تم تسجيل حساب لاعب من هذا الجهاز بالفعل. سجّل الدخول باسم المستخدم وكلمة المرور، أو اطلب من الكابتن فتح التسجيل مرة أخرى من لوحة الإدارة.','A player account has already been registered from this device. Sign in with your username and password, or ask the coach to re-open registration from the admin panel.')),
      [{l:L('حسنًا','OK'),p:true}]);
    return;
  }
  slot.appendChild(sec);
  sec.classList.add('act');
  const lv=$('#gateLoginView'), rv=$('#gateRegView');
  if(lv) lv.classList.add('hide');
  if(rv) rv.classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- registration ---------- */
function fillRegSelects(){
  const lv=$('#regLevel'), pl=$('#regPlan');
  if(lv) lv.innerHTML=LEVELS.map(x=>'<option>'+x+'</option>').join('');
  if(pl) pl.innerHTML=PLANS.map(x=>'<option>'+x+'</option>').join('');
}
function waRegMessage(p){
  return (S.lang==='en'?'NEW SUBSCRIPTION REQUEST — CAP EYAD BOXING CLUB\n\n':'طلب اشتراك جديد — نادي الكابتن إياد الشربيني\n\n')+
    (S.lang==='en'?'Name: ':'الاسم: ')+p.nameAr+'\n'+
    (S.lang==='en'?'Name (EN): ':'الاسم بالإنجليزية: ')+(p.nameEn||'—')+'\n'+
    (S.lang==='en'?'Username: ':'اسم المستخدم: ')+p.username+'\n'+
    (S.lang==='en'?'Password: ':'كلمة المرور: ')+p.password+'\n'+
    (S.lang==='en'?'Mobile: ':'الموبايل: ')+p.phone+'\n'+
    (S.lang==='en'?'Age/Weight/Height: ':'السن/الوزن/الطول: ')+(p.age||'—')+' / '+(p.weight||'—')+' / '+(p.height||'—')+'\n'+
    (S.lang==='en'?'Level: ':'المستوى: ')+p.level+'\n'+
    (S.lang==='en'?'Package: ':'الباقة: ')+p.plan+'\n'+
    (S.lang==='en'?'Payment method: ':'طريقة الدفع: ')+p.payMethod+'\n'+
    (S.lang==='en'?'Reference: ':'رقم العملية: ')+(p.payRef||'—')+'\n'+
    (S.lang==='en'?'Notes: ':'ملاحظات: ')+(p.notes||'—')+'\n'+
    (S.lang==='en'?'Date: ':'التاريخ: ')+today();
}
function submitRegister(e){
  e.preventDefault();
  const f=$('#regForm'), fd=new FormData(f), g=k=>String(fd.get(k)||'').trim();
  const err=$('#regErr'); err.textContent='';
  if(regLocked()){ err.textContent=L('التسجيل متاح مرة واحدة فقط من هذا الجهاز. سجّل الدخول بحسابك.','Registration is allowed once only from this device. Sign in with your account.'); return; }
  const username=g('username');
  if(!validUserName(username)){ err.textContent=t('err.userfmt'); f.classList.add('shake'); setTimeout(()=>f.classList.remove('shake'),450); return; }
  if(g('password').length<4){ err.textContent=t('err.passlen'); return; }
  if(g('password')!==g('password2')){ err.textContent=t('err.pass'); return; }
  const nu=normUser(username);
  const taken=(DB.players||[]).some(function(p){
    return normUser(p.username)===nu || normUser(p.nameEn)===nu || normUser(p.nameAr)===nu;
  });
  if(taken){ err.textContent=t('err.user'); return; }
  if(!g('nameAr')||!g('phone')){ err.textContent=t('err.required'); return; }
  const p=Object.assign({
    id:uid('pl'), nameAr:g('nameAr'), nameEn:g('nameEn'), username:username, password:g('password'),
    phone:g('phone'), age:g('age'), weight:g('weight'), height:g('height'),
    level:g('level')||'مبتدئ', plan:g('plan')||'شهري', status:'pending', joinDate:today(), expiry:'',
    payMethod:g('payMethod'), payRef:g('payRef'), notes:g('notes'), champ:false
  }, newPlayerFields());
  p.startedAt=today();
  if(g('weight')) p.weightLog.push({d:today(), w:g('weight')});
  DB.players.push(p);
  DB.requests.push(Object.assign({},p,{rid:uid('rq'), at:new Date().toISOString()}));
  /* one-time registration: lock the form for this device */
  DB.reg = Object.assign({enabled:true,done:false,used:0,username:'',name:'',date:''}, DB.reg||{});
  DB.reg.done=true; DB.reg.used=(Number(DB.reg.used)||0)+1;
  DB.reg.username=p.username; DB.reg.name=p.nameAr; DB.reg.date=today();
  saveDB();
  renderAll();
  f.reset(); fillRegSelects();
  const msg=waRegMessage(p);
  openWA(msg);
  ok('✅', t('ok.reg'), '<p class="sm">'+esc(t('ok.regd'))+'</p>'+
    '<div class="copy-row mt1"><span>'+esc(t('th.user'))+'</span><b dir="ltr">'+esc(p.username)+'</b></div>'+
    '<div class="copy-row mt1"><span>'+esc(t('th.pass'))+'</span><b dir="ltr">'+esc(p.password)+'</b></div>'+
    '<div class="note sm mt2">💬 '+esc(S.lang==='en'?'If WhatsApp did not open, press the button below to send your data to the coach.':'لو لم يُفتح واتساب تلقائيًا اضغط الزر التالي لإرسال بياناتك للكابتن.')+'</div>',
    [{l:'💬 WhatsApp',p:true,fn:function(){ openWA(waRegMessage(p)); }},
     {l:S.lang==='en'?'Back to login':'العودة لتسجيل الدخول',fn:function(){ gateHome(); }}]);
}

/* ---------- profile actions ---------- */
function saveMe(){
  if(!S.user||S.isAdmin) return;
  const p=(DB.players||[]).find(x=>x.id===S.user.id); if(!p) return;
  const oldW=String(p.weight||'');
  p.phone=$('#mePhone').value; p.weight=$('#meWeight').value; p.height=$('#meHeight').value; p.age=$('#meAge').value;
  p.notes=$('#meNotes').value;
  if($('#meCat')) p.cat=$('#meCat').value;
  if($('#meGoal')) p.goal=$('#meGoal').value;
  if(p.weight && String(p.weight)!==oldW){ p.weightLog=p.weightLog||[]; p.weightLog.push({d:today(), w:p.weight}); }
  S.user=p; saveDB(); renderAll();
  $('#meErr').className='ok'; $('#meErr').textContent='✔ '+ L('تم الحفظ','Saved');
  setTimeout(()=>{ $('#meErr').textContent=''; },2500);
}
/* ---------- player personal-system actions ---------- */
function checkIn(){
  const p=myPlayer(); if(!p) return;
  p.attend=p.attend||[];
  const i=p.attend.indexOf(today());
  if(i>-1){ p.attend.splice(i,1); p.points=Math.max(0,(p.points||0)-2); }
  else{ p.attend.push(today()); p.points=(p.points||0)+2; }
  S.user=p; saveDB(); renderAll();
  $('#pfWErr') && ($('#pfWErr').className='ok', $('#pfWErr').textContent='✔ '+L('تم تحديث الحضور','Attendance updated'));
}
function saveWeight(){
  const p=myPlayer(); if(!p) return;
  const w=String(($('#pfW')&&$('#pfW').value)||'').trim();
  const e=$('#pfWErr');
  if(!w || isNaN(Number(w))){ if(e){ e.className='err'; e.textContent=L('اكتب وزنًا صحيحًا بالكيلوجرام.','Enter a valid weight in kg.'); } return; }
  p.weightLog=p.weightLog||[]; p.weightLog.push({d:today(), w:w}); p.weight=w;
  if($('#pfCat')) p.cat=$('#pfCat').value;
  if($('#pfW')) $('#pfW').value='';
  S.user=p; saveDB(); renderAll();
  const e2=$('#pfWErr'); if(e2){ e2.className='ok'; e2.textContent='✔ '+L('تم حفظ وزنك','Weight saved'); }
}
function saveGoal(){
  const p=myPlayer(); if(!p) return;
  if($('#pfGoal')) p.goal=$('#pfGoal').value;
  S.user=p; saveDB(); renderAll();
}
function pfAction(kind){
  const p=myPlayer(); if(!p) return;
  const num=String(p.phone||'').replace(/[^0-9]/g,'');
  const wa=num? (num.charAt(0)==='0'? '2'+num : num) : '';
  const head=(S.lang==='en'?'Coach Eyad — ':'كابتن إياد — ')+p.nameAr+' ('+p.username+')\n\n';
  if(kind==='checkin'){ checkIn(); return; }
  if(kind==='wa'){ openWA(head+L('أريد الاستفسار عن تدريبي ومواعيد الحصص.','I would like to ask about my training and session times.')); return; }
  if(kind==='renew'){
    const d=daysLeft(p);
    openWA(head+L('أطلب تجديد اشتراكي.','I would like to renew my subscription.')+'\n'+
      L('الباقة الحالية: ','Current package: ')+(p.plan||'—')+'\n'+
      L('الوزن: ','Weight: ')+(p.weight||'—')+' kg\n'+
      L('حالة الاشتراك: ','Status: ')+(p.status||'')+(d!==null?' · '+d+' '+L('يوم متبقي','days left'):''));
    return;
  }
  if(kind==='prog'){ openWA(head+L('أطلب تحديث برنامجي التدريبي.','Please update my training program.')+'\n'+L('المستوى: ','Level: ')+(p.level||'—')); return; }
  if(kind==='report'){ openWA(personalReport(p)); return; }
}
function changePass(){
  const e=$('#cpErr'); e.className='err'; e.textContent='';
  if(!S.user) return;
  const oldV=$('#cpOld').value, nv=$('#cpNew').value;
  if(S.isAdmin){
    const adm=DB.admins[0];
    if(oldV!==adm.password){ e.textContent=S.lang==='en'?'Current password is wrong.':'كلمة المرور الحالية غير صحيحة.'; return; }
    if(nv.length<4){ e.textContent=t('err.passlen'); return; }
    adm.password=nv; saveDB(); e.className='ok'; e.textContent='✔ '+t('ok');
    $('#cpOld').value=''; $('#cpNew').value=''; return;
  }
  const p=(DB.players||[]).find(x=>x.id===S.user.id); if(!p) return;
  if(oldV!==p.password){ e.textContent=S.lang==='en'?'Current password is wrong.':'كلمة المرور الحالية غير صحيحة.'; return; }
  if(nv.length<4){ e.textContent=t('err.passlen'); return; }
  p.password=nv; saveDB(); e.className='ok'; e.textContent='✔ '+t('ok');
  $('#cpOld').value=''; $('#cpNew').value='';
}
function copyText(id){
  const el=$('#'+id); if(!el) return;
  const v=el.textContent.trim();
  const done=function(){ punch(0.05); el.style.color='#a9f0c6'; setTimeout(()=>el.style.color='',900); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(done, done); }
  else{ const ta=document.createElement('textarea'); ta.value=v; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); done(); }
}
</script>

<script>
/* ============================================================
   PART 3 — admin panel + events + init
   ============================================================ */
function buildTbl(sel, cols, rows, emptyMsg){
  const el=$(sel); if(!el) return;
  el.innerHTML='<thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
    (rows.length? rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')
     : '<tr><td colspan="'+cols.length+'" class="mut">'+esc(emptyMsg||'—')+'</td></tr>')+'</tbody>';
}
function openEdit(title, fields, data, onSave){
  $('#editTitle').textContent=title;
  $('#editBody').innerHTML = fields.map(function(f){
    const v = (data && data[f.k]!=null && data[f.k]!=='')? data[f.k] : (f.def!=null?f.def:'');
    if(f.t==='textarea'||f.t==='lines')
      return '<div class="fld"><label>'+esc(f.l)+'</label><textarea class="inp" data-f="'+f.k+'" style="min-height:'+(f.t==='lines'?160:90)+'px" dir="'+(f.t==='lines'?'ltr':'rtl')+'">'+esc(v)+'</textarea>'+(f.h?'<div class="hint">'+esc(f.h)+'</div>':'')+'</div>';
    if(f.t==='select'){
      const opts=(f.o||[]).map(function(o){
        const val=Array.isArray(o)?o[0]:o, lab=Array.isArray(o)?o[1]:o;
        return '<option value="'+esc(val)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(lab)+'</option>';
      }).join('');
      return '<div class="fld"><label>'+esc(f.l)+'</label><select class="inp" data-f="'+f.k+'">'+opts+'</select></div>';
    }
    return '<div class="fld"><label>'+esc(f.l)+'</label><input class="inp" data-f="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(v)+'"></div>';
  }).join('')+'<div class="flex mt2"><button class="btn p" id="edSave">'+esc(t('btn.save2'))+'</button><button class="btn" data-close="editModal">'+esc(t('btn.cancel'))+'</button></div>';
  $('#edSave').onclick=function(){
    const o={}; $$('#editBody [data-f]').forEach(function(el){ o[el.getAttribute('data-f')]=el.value; });
    if(onSave(o)!==false) closeModal('editModal');
  };
  openModal('editModal');
}
const STATUS_OPTS=[['active','نشط / Active'],['pending','قيد المراجعة / Pending'],['stopped','موقوف / Suspended'],['expired','منتهي / Expired']];
function playerFields(){
  return [
    {k:'nameAr',l:L('الاسم بالعربية','Name (Arabic)')},{k:'nameEn',l:L('الاسم بالإنجليزية','Name (English)')},
    {k:'username',l:L('اسم المستخدم (اسم اللاعب)','Username (player name)'),h:L('اسم اللاعب بالعربية أو الإنجليزية','The player name in Arabic or English')},
    {k:'password',l:'كلمة المرور'},{k:'phone',l:'رقم الموبايل / واتساب'},{k:'age',l:'السن',t:'number'},
    {k:'weight',l:'الوزن (كجم)',t:'number'},{k:'height',l:'الطول (سم)',t:'number'},
    {k:'level',l:L('المستوى','Level'),t:'select',o:LEVELS},{k:'plan',l:L('الباقة','Package'),t:'select',o:PLANS},
    {k:'status',l:L('حالة الاشتراك','Subscription status'),t:'select',o:STATUS_OPTS},
    {k:'startedAt',l:L('بداية الاشتراك','Subscription start'),t:'date'},
    {k:'expiry',l:L('تاريخ انتهاء الاشتراك','Subscription end'),t:'date'},
    {k:'payMethod',l:L('طريقة الدفع','Payment method'),t:'select',o:PAYS},
    {k:'payRef',l:L('رقم عملية التحويل / المرجع','Transfer reference')},
    {k:'cat',l:L('الوزن الملاكمي (الفئة)','Boxing weight class')},
    {k:'goal',l:L('الهدف الشخصي للاعب','Player personal goal')},
    {k:'progId',l:L('البرنامج المخصَّص للاعب','Assigned program'),t:'select',
      o:[['',L('— بدون (تلقائي حسب المستوى)','— Auto by level')]].concat((DB.programs||[]).map(function(g){ return [g.id,g.title]; }))},
    {k:'wins',l:L('عدد مرات الفوز','Wins'),t:'number'},
    {k:'losses',l:L('عدد مرات الخسارة','Losses'),t:'number'},
    {k:'sparring',l:L('عدد حصص السبارينج','Sparring sessions'),t:'number'},
    {k:'points',l:L('نقاط اللاعب','Player points'),t:'number'},
    {k:'notes',l:L('ملاحظات','Notes'),t:'textarea'}
  ];
}
function renderAdmin(){
  if(!S.isAdmin) return;
  const q=(($('#adSearch')&&$('#adSearch').value)||'').trim().toLowerCase();
  const pl=(DB.players||[]).filter(p=>!q || [p.nameAr,p.nameEn,p.username,p.phone].join(' ').toLowerCase().indexOf(q)>-1);
  buildTbl('#adTbl',['#',t('th.name'),t('th.user'),t('th.pass'),t('th.phone'),t('th.plan'),L('الحضور','Sessions'),L('باقي','Left'),t('th.status'),t('th.act')],
    pl.map(function(p,i){
      const d=daysLeft(p);
      return [String(i+1),
        '<b>'+esc(p.nameAr)+'</b>'+((p.champ)?' <span class="chip">🏆</span>':'')+'<div class="xs mut">'+esc(p.goal||p.nameEn||'')+'</div>',
        '<span dir="ltr">'+esc(p.username)+'</span>', '<span dir="ltr">'+esc(p.password)+'</span>',
        '<span dir="ltr">'+esc(p.phone)+'</span>', esc(p.plan),
        String((p.attend||[]).length), (d===null?'—':(d+' '+L('ي','d'))), subChip(p),
        '<div class="tbl-acts">'+
          '<button class="btn sm g" data-att="'+p.id+'">✅ '+L('حضور','Attend')+'</button>'+
          '<button class="btn sm bl" data-renew="'+p.id+'">💳 '+L('تجديد','Renew')+'</button>'+
          '<button class="btn sm" data-note="'+p.id+'">📝 '+L('ملاحظة','Note')+'</button>'+
