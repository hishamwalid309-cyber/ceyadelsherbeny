/* ---------- sound (subtle boxing click) ---------- */
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } return AC; }
function punch(vol){
  if(!S.sound) return;
  const c = audio(); if(!c) return;
  const v = (vol||0.05);
  const t0 = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type='sine'; o.frequency.setValueAtTime(170,t0);
  o.frequency.exponentialRampToValueAtTime(48,t0+0.16);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(v,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+0.26);
  const len = 1024, buf = c.createBuffer(1,len,c.sampleRate), dt = buf.getChannelData(0);
  for(let i=0;i<len;i++) dt[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=850;
  const ng=c.createGain(); ng.gain.value=v*0.5;
  src.connect(f); f.connect(ng); ng.connect(c.destination); src.start(t0);
}
function setSound(on, quiet){
  S.sound = !!on; DB.settings.sound = S.sound; saveDB();
  ['#soundBtn','#fabSound','#gateSound'].forEach(function(sel){
    const el=$(sel); if(!el) return;
    const ic = S.sound?'🔊':'🔇';
    if(sel==='#gateSound') el.innerHTML = ic+' <span>'+ (S.lang==='en'?'Click sound':'صوت النقر') +'</span>';
    else if(sel==='#soundBtn') el.textContent = ic;
    else el.textContent = ic;
  });
  const cb=$('#setSound'); if(cb) cb.checked = S.sound;
  if(S.sound && !quiet) punch(0.045);
}

/* ---------- router ---------- */
function showPage(name, silent){
  if(name==='admin' && !S.isAdmin){ ok('⛔', S.lang==='en'?'Admins only':'خاص بالكابتن فقط', S.lang==='en'?'This page is available to the coach account only.':'هذه الصفحة متاحة لحساب الكابتن إياد فقط.'); return; }
  if(!DB.pages) {}
  S.page = name;
  $$('.page').forEach(p=>p.classList.toggle('act', p.id==='p-'+name));
  $$('#nav a').forEach(a=>a.classList.toggle('act', a.getAttribute('data-page')===name));
  const nav=$('#nav'); if(nav) nav.classList.remove('open');
  try{ history.replaceState(null,'','#/'+name); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
  if(!silent) punch(0.04);
  reveal();
}

/* ---------- effects ---------- */
function reveal(){
  const els=$$('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('on')); return; }
  if(!window.__io){
    window.__io = new IntersectionObserver(function(en){
      en.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('on'); } });
    },{threshold:0.12});
  }
  els.forEach(e=>{ if(!e.classList.contains('on')) window.__io.observe(e); });
}
function counters(){
  $$('[data-count]').forEach(function(el){
    if(el.dataset.done) return;
    const target = toInt(el.getAttribute('data-count'));
    el.dataset.done='1';
    let cur=0, step=Math.max(1,Math.round(target/38));
    const iv=setInterval(function(){
      cur+=step; if(cur>=target){ cur=target; clearInterval(iv); }
      el.textContent = cur + (target>=25?'+':'');
    },32);
  });
}
const TYPE_LIST = () => (DB.settings.typed||'').split(/[•,|\n]+/).map(s=>s.trim()).filter(Boolean);
let typeIdx=0, typeCh=0, typeDel=false;
function typeLoop(){
  const el=$('#typedText'); if(!el) return;
  const list=TYPE_LIST(); if(!list.length) return;
  const cur=list[typeIdx%list.length];
  if(!typeDel){
    typeCh++; el.textContent=(S.lang==='en'?'BOXING · ':'ملاكمة · ')+cur.slice(0,typeCh);
    if(typeCh>=cur.length){ typeDel=true; setTimeout(typeLoop,2100); return; }
  } else {
    typeCh--; el.textContent=(S.lang==='en'?'BOXING · ':'ملاكمة · ')+cur.slice(0,typeCh);
    if(typeCh<=0){ typeDel=false; typeIdx++; }
  }
  setTimeout(typeLoop, typeDel?38:78);
}
function buildMarquee(){
  const items = S.lang==='en'
    ? ['BOXING','DISCIPLINE','STRENGTH','RESPECT','CHAMPIONS','CAP EYAD EL-SHERBENI','TRAINING','POWER','HONOR OF THE RING']
    : ['ملاكمة','انضباط','قوة','احترام','أبطال','الكابتن إياد الشربيني','تدريب','إرادة','شرف الحلبة'];
  let html='';
  for(let r=0;r<2;r++){ items.forEach(function(w){ html+='<span>'+w+'</span><span class="sep">•</span>'; }); }
  ['#mq1','#mq2'].forEach(function(s){ const el=$(s); if(el) el.innerHTML=html; });
}

/* ---------- whatsapp ---------- */
function waPhone(){ return String(DB.settings.wa||WA_DEF).replace(/[^0-9]/g,''); }
function openWA(text){
  const url='https://wa.me/'+waPhone()+'?text='+encodeURIComponent(text||'');
  window.open(url,'_blank','noopener');
  return url;
}
function notifyCaptain(text){ try{ openWA(text); }catch(e){} }
/* send a WhatsApp message to a specific number (coach → player) */
function intlNum(raw){
  let n=String(raw||'').replace(/[^0-9]/g,'');
  if(!n) return '';
  if(n.charAt(0)==='0') n='2'+n;          /* 01xxxxxxxxx → 201xxxxxxxxx */
  return n;
}
function waTo(num, text){
  const n=intlNum(num); if(!n) return '';
  const url='https://wa.me/'+n+'?text='+encodeURIComponent(text||'');
  window.open(url,'_blank','noopener');
  return url;
}
function msgToPlayer(p, body){
  if(!intlNum(p.phone)){ ok('⚠️','!',esc(L('لا يوجد رقم موبايل مسجَّل لهذا اللاعب.','No mobile number saved for this player.'))); return; }
  waTo(p.phone, body);
}

/* ---------- modals ---------- */
function openModal(id){ const m=$('#'+id); if(m) m.classList.add('on'); }
function closeModal(id){ const m=$('#'+id); if(m) m.classList.remove('on'); }
function ok(icon,title,body,acts){
  $('#okT').textContent = title||'';
  $('#okB').innerHTML = '<div class="flex" style="gap:14px;align-items:flex-start"><span style="font-size:34px">'+(icon||'✅')+'</span><div>'+body+'</div></div>';
  const box=$('#okAct'); box.innerHTML='';
  (acts||[]).forEach(function(a){
    const b=document.createElement('button'); b.className='btn '+(a.p?'p':''); b.textContent=a.l;
    b.onclick=function(){ closeModal('okModal'); if(a.fn) a.fn(); };
    box.appendChild(b);
  });
  if(!(acts&&acts.length)){
    const b=document.createElement('button'); b.className='btn p'; b.textContent='حسنًا';
    b.onclick=function(){ closeModal('okModal'); }; box.appendChild(b);
  }
  openModal('okModal');
}
</script>

